<title>Example City from Above</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: full-bleed 3D sky view of the city; floating white-stone panels — places index (left), lore card (right), map controls (bottom-right) */
:root{
  --sky:#bcd3e2;
  --panel:rgba(249,249,246,.94);
  --ink:#1b2530;
  --muted:#56636f;
  --line:rgba(27,37,48,.13);
  --accent:#2c6590;
  --accent-soft:rgba(44,101,144,.11);
  --gold:#94701c;
  --shadow:0 10px 30px rgba(20,32,44,.18);
  --label-bg:rgba(250,250,247,.88);
  --label-ink:#1b2530;
  --label-hl:#f2c14e;
  --on-accent:#ffffff;
  --card:rgba(255,255,255,.65);
  --danger:#b3373f;
  --f-display:"Marcellus", "Trajan Pro", Georgia, "Times New Roman", serif;
  --f-sc:"Marcellus SC", "Marcellus", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0f151b; --panel:rgba(15,20,26,.93); --ink:#e5e9ec; --muted:#9ba8b3;
    --line:rgba(229,233,236,.14); --accent:#88b8dc; --accent-soft:rgba(136,184,220,.14);
    --gold:#dcb95f; --shadow:0 10px 30px rgba(0,0,0,.45); --on-accent:#0f151b; --card:rgba(255,255,255,.04); --danger:#f08a8f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0f151b; --panel:rgba(15,20,26,.93); --ink:#e5e9ec; --muted:#9ba8b3;
  --line:rgba(229,233,236,.14); --accent:#88b8dc; --accent-soft:rgba(136,184,220,.14);
  --gold:#dcb95f; --shadow:0 10px 30px rgba(0,0,0,.45); --on-accent:#0f151b; --card:rgba(255,255,255,.04); --danger:#f08a8f; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* places index */
#places{position:absolute;top:16px;left:16px;bottom:16px;width:292px;display:flex;flex-direction:column;overflow:hidden;z-index:3}
.brand{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.brand-text{flex:1;min-width:0}
.brand h1{margin:0;font-family:var(--f-sc);font-weight:400;font-size:30px;letter-spacing:.06em;line-height:1}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
#togglePlaces{display:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.search{padding:0 14px 10px}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
#list{flex:1;min-height:0;overflow:auto;padding:0 8px 8px}
.group h2{margin:12px 10px 4px;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:12px 1fr;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 10px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .dot{width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.25);grid-row:span 2}
.item .nm{font-family:var(--f-display);font-size:15px;line-height:1.2}
.item .sub{font-size:12px;color:var(--muted);line-height:1.2}
.empty{padding:10px 12px;color:var(--muted);font-size:13px}
.foot{border-top:1px solid var(--line);padding:10px 16px 12px;font-size:12px;color:var(--muted);line-height:1.4}

/* lore card */
#info{position:absolute;top:16px;right:16px;width:350px;max-height:calc(100% - 32px);overflow:auto;z-index:3;box-sizing:border-box;padding:18px 20px 16px}
.info-head{display:flex;gap:10px;align-items:flex-start}
.info-head > div{flex:1;min-width:0}
.kicker{margin:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
#info h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.12;text-wrap:balance}
.alt{margin:6px 0 0;color:var(--muted);font-style:italic;font-size:14px}
#closeInfo{border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.facts{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.facts dt{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding-top:3px}
.facts dd{margin:0;min-width:0}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;margin-right:6px}
.desc{margin:14px 0 0}
.fall{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fall h3{margin:0 0 4px;font-family:var(--f-sc);font-weight:400;font-size:14px;letter-spacing:.08em;color:var(--gold)}
.fall p{margin:0}
.src{margin:14px 0 0;font-size:12px;color:var(--muted)}

/* controls */
#controls{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
#controls button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1;padding:0}
#controls button[aria-pressed="false"]{opacity:.55}
#controls svg{width:22px;height:22px}
#needle{transition:none}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;padding:7px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap;border-radius:999px}
#hint b{color:var(--ink);font-weight:500}

/* map labels: drawn over the daylit scene, so they keep their own light chip in both themes */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;border-radius:6px;padding:2px 7px 3px;background:var(--label-bg);color:var(--label-ink);font-family:var(--f-display);font-size:12.5px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);will-change:transform}
.lbl.t1{font-family:var(--f-sc);font-size:14px;letter-spacing:.05em}
.lbl.on{background:var(--label-hl);color:#1b2530}
.lbl[hidden]{display:none!important}
#tip{position:absolute;z-index:4;pointer-events:none;padding:4px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-display);font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
/* explore / build */
.modes{display:flex;gap:3px;margin:0 14px 10px;padding:3px;border:1px solid var(--line);border-radius:9px}
.modes button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 0;font-weight:500;font-size:14px;cursor:pointer;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.modes button:disabled{opacity:.5;cursor:default}
.pane{display:flex;flex-direction:column;flex:1;min-height:0}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 14px 8px}
.tools button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.bscroll{flex:1;min-height:0;overflow:auto;padding:0 14px 12px}
.pal h3{margin:10px 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 2px 6px;cursor:pointer;font-size:12px;line-height:1.15;text-align:center;min-width:0}
.card img,.card .ph{width:54px;height:54px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.olabel,.field label,.flabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sws{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.sw-b{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.sw-b[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw-c{width:24px;height:24px;border:1px dashed var(--muted);border-radius:6px;padding:0;background:transparent;cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row .olabel,.row .flabel,.row label{min-width:44px}
output{font-variant-numeric:tabular-nums;font-size:13px;min-width:40px;text-align:center}
.mini{border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.mini:disabled{opacity:.45;cursor:default}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.chk input{accent-color:var(--accent)}
.counts{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.bfoot{border-top:1px solid var(--line);padding:8px 14px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
#saveState{margin-left:auto;color:var(--muted);font-size:12px}
.confirm{border-top:1px solid var(--line);padding:10px 14px 12px;font-size:13px;background:var(--accent-soft)}
.confirm p{margin:0 0 8px}
.danger{color:var(--danger)!important}
.field{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.field.row{flex-direction:row}
.field input:not([type]),.field textarea{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.acts button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.acts button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.muted{color:var(--muted)}
.portrait{margin-top:12px;background:var(--accent-soft);border-radius:8px;display:flex;justify-content:center;padding:6px}
.portrait span{display:block;width:128px;height:128px;background-size:200% 100%;background-repeat:no-repeat;image-rendering:pixelated;animation:idle 1.04s steps(1) infinite}
@keyframes idle{0%{background-position:0 0}50%{background-position:100% 0}}
@media (prefers-reduced-motion: reduce){.portrait span{animation:none}}
.clock{margin:0 14px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.clk-read{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.clk-time{font-family:var(--f-display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.clk-phase{font-size:12.5px;color:var(--muted)}
.clk-row{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:3px}
.seg [aria-pressed="true"],#clkPlay[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#clkJump{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink);padding:4px 6px;min-width:0}
.now{margin:12px 0 0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.now .flabel{display:block;margin-bottom:2px}
#toast{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:5;padding:9px 16px;font-size:13.5px;max-width:min(460px,calc(100% - 32px));text-align:center}
#fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  #places{top:12px;left:12px;right:12px;bottom:auto;width:auto;max-height:calc(100% - 24px)}
  .brand{padding:12px 14px 10px;align-items:center}
  .brand h1{font-size:24px}
  .brand p{display:none}
  #togglePlaces{display:block}
  #places:not(.open) .pane{display:none}
  #places.open #list,#places.open .bscroll{max-height:40vh}
  #info{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:52%;padding:14px 16px}
  #info h2{font-size:22px}
  #controls{right:12px;bottom:auto;top:216px}
  #controls button{width:36px;height:36px}
  #hint{display:none}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }

</style>
<div id="app">
  <div id="scene" aria-label="3D map of Example City seen from above"></div>
  <div id="labels"></div>

  <aside id="places" class="panel" aria-label="Places in Example City">
    <div class="brand">
      <div class="brand-text">
        <h1>Example City</h1>
        <p>TODO: one line on what and where this city is</p>
      </div>
      <button id="togglePlaces" aria-expanded="false" aria-controls="explorePane buildPane">Menu</button>
    </div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button id="modeExplore" role="tab" aria-selected="true" aria-controls="explorePane">Explore</button>
      <button id="modeBuild" role="tab" aria-selected="false" aria-controls="buildPane" disabled title="Loading your saved buildings">Build</button>
    </div>
    <div class="clock" aria-label="City clock">
      <div class="clk-read"><span id="clkTime" class="clk-time">08:00</span><span id="clkPhase" class="clk-phase">Morning · Day 1</span></div>
      <button class="mini" id="clkPlay" aria-label="Pause the clock" aria-pressed="false">Pause</button>
      <div class="clk-row">
        <div class="seg" id="clkSpeed" role="group" aria-label="Clock speed">
          <button class="mini" data-rate="1" aria-pressed="true" title="One minute of city time every second">1&times;</button>
          <button class="mini" data-rate="5" aria-pressed="false" title="Five minutes of city time every second">5&times;</button>
          <button class="mini" data-rate="20" aria-pressed="false" title="Twenty minutes of city time every second">20&times;</button>
        </div>
        <select id="clkJump" aria-label="Jump to a time of day"><option value="">Jump to…</option><option value="5.5">Dawn</option><option value="8">Morning</option><option value="12">Midday</option><option value="15">Afternoon</option><option value="18.5">Evening</option><option value="22">Night</option></select>
      </div>
    </div>
    <div id="explorePane" class="pane" role="tabpanel" aria-labelledby="modeExplore">
      <div class="search">
        <label for="q" hidden>Search places</label>
        <input id="q" type="search" placeholder="Search districts, people, places" autocomplete="off">
      </div>
      <nav id="list"></nav>
      <div class="foot">TODO: a note on what is sourced and what is this map&#x27;s interpretation.</div>
    </div>
    <div id="buildPane" class="pane" role="tabpanel" aria-labelledby="modeBuild" hidden>
      <div class="tools" role="group" aria-label="Build tool">
        <button data-tool="place" aria-pressed="true" title="Place buildings (1)">Place</button>
        <button data-tool="edit" aria-pressed="false" title="Select and edit your buildings (2)">Select</button>
        <button data-tool="demolish" aria-pressed="false" title="Remove buildings (3)">Demolish</button>
      </div>
      <div class="bscroll">
        <div id="palette" class="pal"></div>
        <div class="opts">
          <div><span class="olabel">Color</span><div class="sws" id="curSw"></div></div>
          <div class="row"><label for="sizeIn" class="olabel">Size</label><input type="range" id="sizeIn" min="0.5" max="2.5" step="0.1" value="1"><output id="sizeOut" for="sizeIn">1.0&times;</output></div>
          <div class="row"><span class="olabel">Turn</span><button class="mini" id="rotMinus" title="Turn left (Q)">&minus;15&deg;</button><output id="rotOut">0&deg;</output><button class="mini" id="rotPlus" title="Turn right (E)">+15&deg;</button></div>
          <label class="chk"><input type="checkbox" id="snapIn" checked> Snap to the grid</label>
        </div>
        <p class="counts" id="counts"></p>
      </div>
      <div class="bfoot">
        <button class="mini" id="undoBtn" disabled title="Undo (Ctrl+Z)">Undo</button>
        <button class="mini" id="redoBtn" disabled title="Redo (Ctrl+Y)">Redo</button>
        <button class="mini danger" id="resetBtn">Reset</button>
        <span id="saveState"></span>
      </div>
      <div class="confirm" id="resetConfirm" hidden>
        <p id="resetText"></p>
        <div class="row"><button class="mini danger" id="resetYes">Reset the sandbox</button><button class="mini" id="resetNo">Keep everything</button></div>
      </div>
    </div>
  </aside>

  <article id="info" class="panel" hidden aria-live="polite"></article>

  <div id="controls">
    <button id="rotL" title="Rotate left 90°" aria-label="Rotate view left">&#x27F2;</button>
    <button id="rotR" title="Rotate right 90°" aria-label="Rotate view right">&#x27F3;</button>
    <button id="compass" title="Reset rotation" aria-label="Reset rotation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g id="needle"><path d="M12 3 L15.5 12 L12 10.6 L8.5 12 Z" fill="#c0392b"/><path d="M12 21 L8.5 12 L12 13.4 L15.5 12 Z" fill="currentColor" opacity=".55"/></g></svg>
    </button>
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <button id="home" title="Show the whole city" aria-label="Show the whole city">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
    <button id="peopleToggle" title="Show or hide people" aria-label="People" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="7" r="3"/><path d="M3.5 20c.6-4 2.8-6 5.5-6s4.9 2 5.5 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 13.6c2.4-.3 4.4 1.4 5 5.4"/></svg>
    </button>
    <button id="lblToggle" title="Show or hide labels" aria-label="Labels" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10l5 5-5 5H4z"/></svg>
    </button>
  </div>

  <div id="hint" class="panel"><b>Drag</b> to pan · <b>Scroll</b> to zoom · <b>Right-drag</b> or the arrow buttons to rotate · <b>Click</b> a building</div>
  <div id="tip" hidden></div>
  <div id="toast" class="panel" hidden role="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* Noldor style: how the Elves of Gondolin build, for citymaker.
   White dressed stone, slate-blue and gold caps, crenellated walls with round towers, fountains and hedged gardens.
   A style draws; the engine decides where. Every function here is called by the engine with E (its helpers) or
   B (the instanced shapes the generated city draws into). Keep the random calls in each piece in the same order,
   or the generated city of every city using this style changes (and saved demolitions stop matching). */
(function(){
window.STYLES=window.STYLES||{};
window.STYLES.noldor={
  palette:{tier:"#d8d3c6",paving:"#ebe6d8",lampPost:"#6a6152",lampUnlit:"#7d725e",lampLit:"#ffe2a0"},
  // rows of houses: first row's radius, depth of a row, lane between row pairs, house width [min, extra], gap [min, extra],
  // alley [chance, width], and how much shallower than the row a house is [min, extra]. What stands on each lot is pieces().lot.
  rows:{start:30.5,depth:5.4,lane:2.4,w:[3,3.6],gap:[.35,.8],alley:[.07,2.4],cut:[.35,1.3]},
  // courtyards and gardens per district, and their sizes [min, extra]
  yards:{courts:7,gardens:5,gardenChance:.45,gardenR:[6.5,4],courtR:[5.5,2.8]},
  buckets:[],                                   // extra instanced shapes (none: the standard ones are enough)

  // the hall of a district: a white hall with a pyramid roof, styled by its motif, with a banner
  hall(h,E){
    const {THREE,P,DEG,lam,groundY,UNIT_BOX,PYRAMID,CYL,CONE,BLOB}=E;
    const g=new THREE.Group(), pos=P(h.hall[0],h.hall[1],groundY(h.hall[1]));
    g.position.copy(pos); g.rotation.y=-h.hall[0]*DEG;
    const white=lam("#f4f1ea"), roofC=lam(h.color), trim=lam(new THREE.Color(h.color).lerp(new THREE.Color("#ffffff"),.25));
    const add=(geo,mat,x,y,z,sx,sy,sz)=>{const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); g.add(m); return m;};
    const low=h.motif==="low";
    const bw=low?16:12, bh=low?4.5:7, bd=low?12:14;
    add(UNIT_BOX,white,0,0,0,bw,bh,bd);
    add(PYRAMID,roofC,0,bh,0,bw+1.4,low?2.6:5,bd+1.4);
    switch(h.motif){
      case "spire": add(CYL,white,0,bh,0,2.4,12,2.4); add(CONE,lam("#d8b34a"),0,bh+12,0,3,7,3); break;
      case "low": add(UNIT_BOX,lam("#26262b"),0,0.02,-9.5,5,.25,4); break;
      case "tower": add(CYL,white,4,0,5,2,18,2); add(CONE,roofC,4,18,5,2.6,6,2.6); add(CYL,white,-4,0,5,1.6,14,1.6); add(CONE,roofC,-4,14,5,2.1,5,2.1); break;
      case "arch": { const a=new THREE.Mesh(new THREE.TorusGeometry(6,.9,8,28,Math.PI),trim); a.position.set(0,0,-10); g.add(a); break; }
      case "pillar": add(CYL,white,0,bh,0,1.7,22,1.7); add(CYL,trim,0,bh+22,0,2.4,1.2,2.4); break;
      case "snowtower": add(CYL,white,0,0,-1,3.6,30,3.6); add(CONE,lam("#f7fafc"),0,30,-1,4.4,9,4.4); break;
      case "wing": add(CYL,white,0,bh,0,2,9,2); add(CONE,trim,0,bh+9,0,2.6,5,2.6);
        { const w1=add(UNIT_BOX,lam("#ffffff"),-4,bh+6,0,7,.5,3); w1.rotation.z=.5; const w2=add(UNIT_BOX,lam("#ffffff"),4,bh+6,0,7,.5,3); w2.rotation.z=-.5; } break;
      case "tree": { const tm=new THREE.MeshPhongMaterial({color:0x3f7d3e,flatShading:true,shininess:5}); [[-9,6,-4,4.6],[-10.5,8.5,-6,3.2],[-7.4,7.8,-1.8,3]].forEach(([x,y,z,s])=>{ const m=new THREE.Mesh(BLOB,tm); m.position.set(x,y,z); m.scale.setScalar(s); g.add(m); }); add(CYL,lam("#6b5a40"),-9,0,-4,.7,4,.7); break; }
      case "dome": { const d=new THREE.Mesh(new THREE.SphereGeometry(4.6,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshPhongMaterial({color:0xe2b437,shininess:80,emissive:0x3a2a05})); d.position.y=bh+3.5; g.add(d); add(CYL,white,0,bh,0,4.6,3.5,4.6); break; }
      case "pool": { const pool=add(UNIT_BOX,lam("#4f9fcf",{emissive:new THREE.Color("#163e58")}),0,0.05,-11.5,9,.3,6); add(CYL,white,0,0,-11.5,.6,3,.6); break; }
      case "rotunda": add(CYL,white,0,bh,0,3.4,4,3.4); add(CONE,roofC,0,bh+4,0,4,4,4); break;
      case "forge": add(UNIT_BOX,lam("#5b5550"),4,bh,3,2.4,8,2.4); add(UNIT_BOX,lam("#ff8a3d",{emissive:new THREE.Color("#c2410c")}),4,bh+8,3,2.4,.3,2.4); add(UNIT_BOX,lam("#5b5550"),-4,bh,-3,2,6,2); break;
    }
    // banner
    add(CYL,lam("#8a8378"),bw/2+1.5,0,bd/2-1,.16,13,.16);
    add(UNIT_BOX,lam(h.color),bw/2+3.1,10,bd/2-1,3.2,2.4,.14);
    return g;

  },

  // the outer wall around the summit's edge, its towers, and the gatehouse with the great stair down the hill
  outerWall(E){
    const {THREE,H,DEG,P,M,edgeR,edgeS,angDist,GATE_B,lam,instanced,own,UNIT_BOX,CYL,CONE}=E;
    const segs=[], towers=[], caps=[], inset=2.5, STEP=2;
    for(let b=0;b<360;b+=STEP){
      if(angDist(b+STEP/2,GATE_B)<3.4) continue;           // gap for the gate
      const p1=P(b,edgeR(b)-inset), p2=P(b+STEP,edgeR(b+STEP)-inset);
      const dx=p2.x-p1.x, dz=p2.z-p1.z, len=Math.hypot(dx,dz)+0.7;
      segs.push({m:M((p1.x+p2.x)/2,H,(p1.z+p2.z)/2,Math.atan2(-dz,dx),len,7,2.6),c:"#f4f1ea",o:"walls"});
    }
    for(let b=0;b<360;b+=7.5){
      if(angDist(b,GATE_B)<6) continue;
      const q=P(b,edgeR(b)-inset);
      towers.push({m:M(q.x,H,q.z,0,3,12,3),c:"#f4f1ea",o:"walls"});
      caps.push({m:M(q.x,H+12,q.z,0,3.7,4.6,3.7),c:"#6f8ea8",o:"walls"});
    }
    instanced(UNIT_BOX,lam("#ffffff"),segs);
    instanced(CYL,lam("#ffffff"),towers);
    instanced(CONE,lam("#ffffff"),caps);

    const g=new THREE.Group(), white=lam("#f6f3ec"), gold=lam("#d8b34a"), stair=lam("#e7e1d0");
    const add=(geo,mat,x,y,z,sx,sy,sz)=>{const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); g.add(m); return m;};
    const gz=edgeS-inset;
    add(CYL,white,-7,H,gz,4.2,16,4.2); add(CONE,gold,-7,H+16,gz,5,6,5);
    add(CYL,white,7,H,gz,4.2,16,4.2);  add(CONE,gold,7,H+16,gz,5,6,5);
    add(UNIT_BOX,white,0,H+9,gz,12,4,3.6);
    const z0=edgeS-1, z1=edgeS*1.42, N=36;
    for(let i=0;i<N;i++){ const top=H*(1-i/N), z=z0+(i+.5)*(z1-z0)/N; add(UNIT_BOX,stair,0,0,z,9,Math.max(.3,top),(z1-z0)/N+.05); }
    for(const s of [-1,1]) for(let i=0;i<N;i+=2){ const top=H*(1-i/N)+1.1, z=z0+(i+.5)*(z1-z0)/N; add(UNIT_BOX,white,s*5,0,z,1,top,(z1-z0)/N*2+.05); }
    g.rotation.y=Math.PI-GATE_B*DEG;    // drawn facing south (bearing 180), turned to face the real gate
    own("gate",g);
  },

  // the walls between levels: battlements, towers, a gatehouse and a stair wherever an avenue climbs
  levelWalls(E){
    const {THREE,DEG,P,M,WALLS,AVENUES,RAMP,R1,angDist,lam,instanced,UNIT_BOX,CYL,CONE}=E;
    const segs=[], merlons=[], towers=[], caps=[], steps=[], trim=[];
    const WHITE="#f4f1ea", BLUE="#6f8ea8", GOLD="#d8b34a";
    WALLS.forEach(({R,yUp,yLow})=>{
      const top=yUp+3.4, half=a=>Math.asin((a.w/2+1.6)/R)/DEG;
      const nearGate=(b,pad)=>AVENUES.some(a=>angDist(b,a.b)<half(a)+pad);
      for(let b=0;b<360;b+=1.5){
        if(nearGate(b+.75,.75)) continue;
        const p1=P(b,R), p2=P(b+1.5,R), dx=p2.x-p1.x, dz=p2.z-p1.z, len=Math.hypot(dx,dz)+.45, yaw=Math.atan2(-dz,dx), mx=(p1.x+p2.x)/2, mz=(p1.z+p2.z)/2;
        segs.push({m:M(mx,yLow,mz,yaw,len,top-yLow,2.6),c:WHITE,o:"walls"});
        merlons.push({m:M(mx,top,mz,yaw,len*.45,1.15,2.7),c:WHITE,o:"walls"});
      }
      const every=R===R1?12:8;
      for(let b=every/2;b<360;b+=every){ if(nearGate(b,4)) continue; const q=P(b,R);
        towers.push({m:M(q.x,yLow,q.z,0,2.4,top+3.2-yLow,2.4),c:WHITE,o:"walls"}); caps.push({m:M(q.x,top+3.2,q.z,0,2.9,4.2,2.9),c:BLUE,o:"walls"}); }
      AVENUES.forEach(a=>{
        const main=!!a.main, tr=main?3.2:2.4, th=top+(main?6:3.4)-yLow, off=half(a)+tr/R/DEG;
        for(const sd of [-1,1]){ const q=P(a.b+sd*off,R);
          towers.push({m:M(q.x,yLow,q.z,0,tr,th,tr),c:WHITE,o:"walls"});
          caps.push({m:M(q.x,yLow+th,q.z,0,tr*1.2,main?5.2:4,tr*1.2),c:main?GOLD:BLUE,o:"walls"}); }
        const q=P(a.b,R);
        segs.push({m:M(q.x,yUp+5.4,q.z,-a.b*DEG,a.w+3.4,2.8,3),c:WHITE,o:"walls"});            // the arch over the gate
        if(main) trim.push({m:M(q.x,yUp+8.2,q.z,-a.b*DEG,a.w+3.6,.35,3.1),c:GOLD,o:"walls"});
        const N=14;
        for(let i=0;i<N;i++){ const r0=R+i*RAMP/N, r1=r0+RAMP/N, t=yUp-(i+.5)/N*(yUp-yLow), m=P(a.b,(r0+r1)/2);
          steps.push({m:M(m.x,yLow,m.z,-a.b*DEG,a.w,Math.max(.2,t-yLow),RAMP/N+.05),c:"#e7e1d0",o:"walls"}); }
      });
    });
    instanced(UNIT_BOX,lam("#ffffff"),segs);
    instanced(UNIT_BOX,lam("#ffffff"),merlons);
    instanced(CYL,lam("#ffffff"),towers);
    instanced(CONE,lam("#ffffff"),caps);
    instanced(UNIT_BOX,lam("#ffffff"),steps);
    instanced(UNIT_BOX,lam("#ffffff",{emissive:new THREE.Color("#2a1e04")}),trim);
  },

  // the pieces of the generated city. B holds the instanced shapes and rand; positions use H and are lifted to their level later
  pieces(B,E){
    const {THREE,M,H,DEG,rand,HOUSES,pick,tangentYaw}=B;
    const wA=new THREE.Color("#f4f0e7"), wB=new THREE.Color("#dcd5c6"), grey=new THREE.Color("#8b9097");
    const tA=new THREE.Color("#4c7d3c"), tB=new THREE.Color("#73a04f");
    const STONE="#efe9dc", PAVE="#e7e0cc", GRASS=["#7da455","#86ab5c","#71984c"], HEDGE="#3f6f35";
    const FLOWERS=["#d9534f","#f0c419","#9b59b6","#f7f7f2","#e67e22","#e05d9b"];
    const tree=(x,z,s,o)=>B.trees.push({m:M(x,H+.1+s*.85,z,rand()*6,s,s*1.15,s),c:tA.clone().lerp(tB,rand()),o});
    function fountain(x,z,R,o){
      B.cyl.push({m:M(x,H,z,0,R,1,R),c:STONE,o});
      B.water.push({m:M(x,H+.9,z,0,R*.86,.14,R*.86),c:"#5aa8d6",o});
      B.cyl.push({m:M(x,H,z,0,R*.13+.25,2.6+R*.5,R*.13+.25),c:STONE,o});
      if(R>2.2) B.cyl.push({m:M(x,H+2.2+R*.4,z,0,R*.42,.5,R*.42),c:STONE,o});
      B.jets.push({m:M(x,H+2.6+R*.5,z,0,R*.16+.2,1.6+R*.45,R*.16+.2),c:"#eaf6ff",o});
    }
    function statue(x,z,yaw,o){
      B.box.push({m:M(x,H,z,yaw,1.7,1.5,1.7),c:"#e0d8c6",o});
      B.cones.push({m:M(x,H+1.5,z,0,.62,2.6,.62),c:"#f7f5ef",o});
      B.trees.push({m:M(x,H+4.35,z,0,.42,.46,.42),c:"#f7f5ef",o});
    }
    function courtyard(x,z,R,o){
      B.cyl.push({m:M(x,H,z,0,R,.14,R),c:PAVE,o});
      B.cyl.push({m:M(x,H,z,0,R*.62,.18,R*.62),c:"#dcd2ba",o});
      const k=rand();
      if(k<.55){ fountain(x,z,1.5+R*.22,o); B.poi.fountains.push({x,z}); }
      else if(k<.8) statue(x,z,rand()*6,o);
      else { B.cyl.push({m:M(x,H,z,0,1.3,1.1,1.3),c:"#cfc7b3",o}); B.water.push({m:M(x,H+1.05,z,0,1,.1,1),c:"#3f86b4",o}); } // a well
      const n=5+Math.floor(rand()*3), a0=rand()*6;
      for(let i=0;i<n;i++){ const a=a0+i/n*Math.PI*2, rr=R-1.3, px=x+Math.cos(a)*rr, pz=z+Math.sin(a)*rr;
        if(rand()<.6) tree(px,pz,.75+rand()*.5,o); else B.box.push({m:M(px,H+.14,pz,tangentYaw(a),1.7,.5,.6),c:"#c9bc9b",o}); }
    }
    function garden(x,z,R,o){
      B.poi.gardens.push({x,z,R});
      B.cyl.push({m:M(x,H,z,0,R,.16,R),c:pick(GRASS),o});
      const segs=16;
      for(let i=0;i<segs;i++){ if(i===0||i===8) continue;  // two gates in the hedge
        const am=(i+.5)/segs*Math.PI*2, rr=R-.45, len=2*rr*Math.sin(Math.PI/segs)+.15;
        B.box.push({m:M(x+Math.cos(am)*rr,H+.16,z+Math.sin(am)*rr,tangentYaw(am),len,1,.75),c:HEDGE,o}); }
      const k=rand();
      if(k<.35){ // pond
        B.cyl.push({m:M(x,H,z,0,R*.42+.3,.45,R*.42+.3),c:STONE,o});
        B.water.push({m:M(x,H+.4,z,0,R*.42,.1,R*.42),c:"#4f9fcf",o});
      } else if(k<.6){ // pavilion
        B.cyl.push({m:M(x,H,z,0,2.3,.4,2.3),c:STONE,o});
        for(let i=0;i<4;i++){ const a=i*Math.PI/2+.785; B.cyl.push({m:M(x+Math.cos(a)*1.6,H+.4,z+Math.sin(a)*1.6,0,.18,2.4,.18),c:STONE,o}); }
        B.cones.push({m:M(x,H+2.8,z,0,2.7,1.8,2.7),c:"#c9a43a",o});
      } else tree(x,z,1.8+rand()*.8,o);
      const beds=6, a0=rand()*6;
      for(let i=0;i<beds;i++){ const a=a0+i/beds*Math.PI*2, rr=R*.62;
        B.box.push({m:M(x+Math.cos(a)*rr,H+.16,z+Math.sin(a)*rr,tangentYaw(a),R*.38,.45,.9),c:pick(FLOWERS),o}); }
      const nt=2+Math.floor(rand()*3);
      for(let i=0;i<nt;i++){ const a=rand()*Math.PI*2, rr=R*.62+(rand()<.5?-1.6:1.4); tree(x+Math.cos(a)*rr,z+Math.sin(a)*rr,.7+rand()*.5,o); }
    }
    return {tree,fountain,statue,courtyard,garden,
      // a fountain square where an avenue meets a ring road
      plaza(q,PR,main,a,o){
        B.cyl.push({m:M(q.x,H,q.z,0,PR,.12,PR),c:"#ece6d6",o});
        B.cyl.push({m:M(q.x,H,q.z,0,PR-.9,.15,PR-.9),c:"#ddd3bc",o});
        if(main||rand()<.65) fountain(q.x,q.z,main?3.3:2.5,o); else statue(q.x,q.z,-a.b*DEG,o);
        if(main) for(let i=0;i<4;i++){ const an=i*Math.PI/2+.785; tree(q.x+Math.cos(an)*(PR-1.6),q.z+Math.sin(an)*(PR-1.6),.9,o); }
      },
      // dressing along a great avenue: trees, or statues and banners on the road from the gate
      avenueDecor({x,z,tx,tz,side,k,a,isGate,o}){
        const GATE_B=isGate?a.b:NaN;
        if(a.b!==GATE_B) tree(x,z,.9+rand()*.35,o);
        else if(k%2===0) statue(x+tx*side*.6,z+tz*side*.6,-a.b*DEG,o);
        else { B.cyl.push({m:M(x,H,z,0,.16,8,.16),c:"#8a8378",o}); B.box.push({m:M(x+tx*side*.9,H+5.2,z+tz*side*.9,-a.b*DEG,1.6,2.6,.12),c:HOUSES[(k+(side>0?3:0))%HOUSES.length].color,o}); }
      },
      // one lot in a row of houses: a slender tower, a garden plot, or a house
      lot({q,b,w,d,rc,e,yaw,h,hc,kind}){
        if(kind<0.045){ // slender tower in a small court
          const tr=1.3+rand()*.7, th=12+rand()*10;
          B.towers.push({m:M(q.x,H,q.z,0,tr,th,tr),c:wA.clone().lerp(wB,rand()*.5),o:h.id});
          B.caps.push({m:M(q.x,H+th,q.z,0,tr*1.3,3.5+rand()*2,tr*1.3),c:hc.clone().lerp(grey,rand()*.2),o:h.id});
        } else if(kind<0.11){ // garden plot
          const n=1+Math.floor(rand()*3);
          for(let k=0;k<n;k++){ const s=1+rand()*1.1, off=(k-(n-1)/2)*(w/n);
            B.trees.push({m:M(q.x+Math.cos(b*DEG)*off,H+s*.85,q.z+Math.sin(b*DEG)*off,rand()*6,s,s*1.15,s),c:tA.clone().lerp(tB,rand()),o:h.id}); }
        } else {
          const ht=3+rand()*3.4+(1-rc/e)*6+(rand()<0.08?4:0);
          B.bodies.push({m:M(q.x,H,q.z,yaw,w,ht,d),c:wA.clone().lerp(wB,rand()),o:h.id});
          if(rand()<0.75) B.roofs.push({m:M(q.x,H+ht,q.z,yaw,w+.45,1.3+rand()*1.6,d+.45),c:hc.clone().lerp(grey,rand()*.3),o:h.id});
        }
      },
    };
  },
};
})();

</script>
<script>
/* Template city for citymaker. Copy this folder to cities/<your-id>/, set id below to match, and fill in every TODO.
   Build with:  python build.py <your-id>     (open dist/<your-id>.html to look at it)
   The plain string fields at the top (id, name, title, tagline, footnote, searchPlaceholder) are read by build.py:
   keep them simple "strings" on one line each. See README.md for the whole workflow. */
(function(){
const SRC="TODO: the books or sources the lore comes from";

window.CITY={
  id:"_template",                                   // TODO: the folder name, e.g. "minas-tirith"
  style:"noldor",                                   // TODO: a style in styles/ (noldor, rohan, ...)
  name:"Example City",                              // TODO
  title:"Example City from Above",                  // TODO: the page title, 2-4 words
  tagline:"TODO: one line on what and where this city is",
  footnote:"TODO: a note on what is sourced and what is this map's interpretation.",
  searchPlaceholder:"Search districts, people, places",
  seed:1,                                           // any number; it decides where the generated houses go
  look:{sky:"#bcd3e2"},

  // the hill: a flat summit of this radius, its outline wobbled by sine waves [count, amount, phase]
  terrain:{height:30, summit:{radius:150,waves:[[3,.05,.7],[5,.03,2.1]]}, mountains:{from:800,to:1200,height:140}},
  // walled levels: each radius is a wall; the ground inside it is one level higher. Use radii:[] for a flat city.
  levels:{height:7, radii:[70], ramp:12},
  // ring roads [radius, width]; avenues: bearing b (0 = north, clockwise), start radius r0, width w, main = great avenue.
  // Keep ring roads at least 10 inside a level wall, so their fountain squares clear the wall.
  streets:{
    rings:[[58,5],[110,4]],
    avenues:[0,60,120,180,240,300].map(b=>({b,r0:22,w:b===180?8:6,main:true})),
  },
  gate:{bearing:180, channel:false},                // the outer gate must sit on a main avenue
  squareStatues:[],                                 // [bearing, radius, owner place id] statues around the central square

  text:{
    districtKicker:"One of the districts",          // TODO: e.g. "One of the Twelve Houses"
    storyHeading:"Its story",                        // TODO: heading over each place's second paragraph
    searchHint:"Try the name of a district.",
    citadel:"the upper city",                       // what the innermost level is called
    square:"the central square",
    citizen:"A citizen going about the city.",
  },

  // TODO: the districts. sector = [from, to] bearings (they should cover the circle); hall = [bearing, radius] of the
  // district's hall, between ring roads and away from avenues; motif = spire | low | tower | arch | pillar | snowtower |
  // wing | tree | dome | pool | rotunda | forge
  districts:[
    {id:"d-north",name:"North Quarter",lord:"TODO",color:"#b3373f",sector:[0,60],hall:[30,86],motif:"spire",heraldry:"TODO",desc:"TODO",fall:null,src:SRC},
    {id:"d-east",name:"East Quarter",lord:"TODO",color:"#3b7dc1",sector:[60,120],hall:[90,86],motif:"tower",heraldry:"TODO",desc:"TODO",fall:null,src:SRC},
    {id:"d-south-east",name:"Market Quarter",lord:"TODO",color:"#d6a32a",sector:[120,180],hall:[150,86],motif:"dome",heraldry:"TODO",desc:"TODO",fall:null,src:SRC},
    {id:"d-south-west",name:"Smiths' Quarter",lord:"TODO",color:"#8e3f2c",sector:[180,240],hall:[210,86],motif:"forge",heraldry:"TODO",desc:"TODO",fall:null,src:SRC},
    {id:"d-west",name:"Garden Quarter",lord:"TODO",color:"#3e7b48",sector:[240,300],hall:[270,86],motif:"tree",heraldry:"TODO",desc:"TODO",fall:null,src:SRC},
    {id:"d-north-west",name:"Temple Quarter",lord:"TODO",color:"#7b5ea8",sector:[300,360],hall:[330,86],motif:"rotunda",heraldry:"TODO",desc:"TODO",fall:null,src:SRC},
  ],

  // places in the Explore list. "walls" and "gate" are required; landmarks add their own.
  // pos = where a click flies to, zoom = how far, ring = selection ring size, label = where the name floats, tier 1-3 = how far out it shows
  places(E){ const {P,H,edgeS}=E; return {
    "keep":{name:"The Keep",kicker:"The Upper City",alt:"TODO",color:"#d8b34a",desc:"TODO",fall:null,src:SRC,
      showAs:"the Keep",pos:P(0,42),zoom:150,ring:20,label:P(0,42,H+40),tier:1},

<script>
(function(){
"use strict";
if(!window.THREE || !THREE.MapControls){ return fail("The 3D library didn't load. Check your connection and reload the page."); }

const CITY=window.CITY;                       // set by cities/<id>/city.js

const H = CITY.terrain.height;                // height of the summit the city stands on
const DEG = Math.PI/180;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:new THREE.Color(c)},o||{}));

function M(x,y,z,yaw,sx,sy,sz){ _e.set(0,yaw,0); _q.setFromEuler(_e); return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),_q.clone(),new THREE.Vector3(sx,sy,sz)); }

HOUSES.forEach(h=>{ h.span=((h.sector[1]-h.sector[0])+360)%360||360; h.center=(h.sector[0]+h.span/2)%360; });

controls.zoomSpeed=1.1; controls.screenSpacePanning=false;

function resize(){ const w=host.clientWidth||1,h=host.clientHeight||1; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host); resize();

/* ---------- light ---------- */
scene.add(new THREE.HemisphereLight(0xe4eef6,0x6d7d58,0.62));
scene.add(new THREE.AmbientLight(0x48505a,0.18));
const sun=new THREE.DirectionalLight(0xfff1da,0.8);

Object.assign(sun.shadow.camera,{left:-270*SCALE,right:270*SCALE,top:270*SCALE,bottom:-270*SCALE,near:10,far:1100*SCALE});

/* ---------- the plain around the hill, and a ring of mountains ---------- */
let groundMesh, hillMesh;   // kept for finding where the builder places things
(function ground(){
  const g=new THREE.PlaneGeometry(4800,4800,260,260); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, col=new Float32Array(p.count*3), c=new THREE.Color();
  const gA=new THREE.Color("#8aa763"), gB=new THREE.Color("#6c8d4c"), rock=new THREE.Color("#8a877e"), snow=new THREE.Color("#f1f4f6");

    const PF=CITY.terrain.plainFrom||300*SCALE, u=smooth(PF,PF+90*SCALE,d)*(1.1*Math.sin(x*0.018)*Math.cos(z*0.021)+0.7*Math.sin((x+z)*0.009));

    c.copy(gA).lerp(gB,n);

})();

/* ---------- the hill: flat summit, sheer sides ---------- */
// the hill's profile: [radius as a fraction of the summit edge, height as a fraction of H]
const RINGS=CITY.terrain.profile||[[0,1],[.3,1],[.6,1],[.85,1],[.97,1],[1,1],[1.015,.93],[1.05,.64],[1.1,.34],[1.18,.15],[1.28,.05],[1.42,0]];
function cliffCalm(b){ return smooth(8,20,angDist(b,GATE_B)); } // keep the slope smooth where the stair climbs
function cliffJit(b,i){ return 1+cliffCalm(b)*(0.035*Math.sin(b*0.9+i*1.7)+0.02*Math.sin(b*2.3+i*0.6)); }
(function hill(){
  const SEG=288, R=RINGS.length, pos=new Float32Array(R*SEG*3), col=new Float32Array(R*SEG*3), c=new THREE.Color();
  const HC=Object.assign({top:"#dad5c8",topB:"#cfc9ba",rock1:"#a29d92",rock2:"#6f6b64",base:"#7f9c5b"},CITY.terrain.colors||{});
  const top=new THREE.Color(HC.top), topB=new THREE.Color(HC.topB), rk1=new THREE.Color(HC.rock1), rk2=new THREE.Color(HC.rock2), grass=new THREE.Color(HC.base);
  for(let i=0;i<R;i++) for(let j=0;j<SEG;j++){
    const b=j/SEG*360, f=RINGS[i][0], e=edgeR(b);
    const r=e*f*(f>1?cliffJit(b,i):1);
    let y=H*RINGS[i][1]; if(f>1&&i<R-1) y+=cliffCalm(b)*1.2*Math.sin(b*3.1+i); if(i===R-1) y=0.03;
    const k=(i*SEG+j)*3, q=P(b,r,y);
    pos[k]=q.x; pos[k+1]=q.y; pos[k+2]=q.z;
    if(f<=1) c.copy(top).lerp(topB,0.5+0.5*Math.sin(b*0.4+f*9));
    else if(i<R-2) c.copy(rk1).lerp(rk2,(i-6)/4+0.15*Math.sin(b*1.7));
    else c.copy(rk2).lerp(grass,i===R-1?1:0.55);
    col[k]=c.r; col[k+1]=c.g; col[k+2]=c.b;
  }
  const idx=[];
  for(let i=0;i<R-1;i++) for(let j=0;j<SEG;j++){
    const a=i*SEG+j, b2=i*SEG+(j+1)%SEG, c2=(i+1)*SEG+j, d=(i+1)*SEG+(j+1)%SEG;
    idx.push(a,b2,c2, b2,d,c2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));

/* ---------- walled levels: the summit rises in rings toward the center ---------- */
// CITY.levels.radii are the walls between levels; each ring inside a wall stands one level higher.
// A stair climbs each wall wherever an avenue crosses it.
const LV=CITY.levels||{height:0,radii:[],ramp:12};
const LVL=LV.height, RAMP=LV.ramp, LEVEL_R=[...LV.radii].sort((a,b)=>a-b);

function groundY(r){ let n=0; for(const R of LEVEL_R) if(r<R) n++; return H+n*LVL; }   // for points on the summit

// height along an avenue, including the stairs that run down the outside of each wall
function streetY(r){ for(const w of WALLS) if(r>=w.R&&r<=w.R+RAMP) return w.yUp-(r-w.R)/RAMP*(w.yUp-w.yLow); return groundY(r); }

(function tiers(){
  const top=lam(STYLE.palette.tier);
  [...LEVEL_R].reverse().map(R=>[R,groundY(R+1e-6),LVL]).forEach(([R,y,h])=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(R,R,h,240).translate(0,h/2,0),top);
    m.position.y=y; m.receiveShadow=true; m.castShadow=true; scene.add(m); m.updateMatrixWorld(); TIERS.push(m);
  });

// the height of the ground (hill, levels or plain) at a point
const _down=new THREE.Raycaster(), _dn=new THREE.Vector3(0,-1,0), _from=new THREE.Vector3();
function surfaceY(x,z){ _down.set(_from.set(x,2000,z),_dn); const h=_down.intersectObjects([hillMesh,groundMesh,...TIERS],false)[0]; return h?h.point.y:0; }

/* ---------- picking registry ---------- */
const pickables=[], INST=[];
function own(id,obj){
  obj.traverse(o=>{ o.userData.placeId=id; if(o.isMesh){ o.castShadow=true; o.receiveShadow=true;

  pickables.push(obj); scene.add(obj); return obj;
}
function instanced(geo,mat,items,shadow){
  if(!items.length) return null;

  items.forEach((it,i)=>{ m.setMatrixAt(i,it.m); const c=new THREE.Color(it.c); m.setColorAt(i,c); base.push(c); });

const paveMat=(c,o)=>lam(c,{polygonOffset:true,polygonOffsetFactor:-(o||1),polygonOffsetUnits:-(o||1)});

/* ---------- streets ---------- */
// ring roads [radius, width]; avenues run out from r0 to the outer wall. "main" avenues are the great ones.

(function streets(){
  const g=new THREE.Group();

    // one stretch of paving per level; the stairs below each wall are built with the walls
    const cuts=[]; let s0=r0; LEVEL_R.forEach(R=>{ if(R>s0){ cuts.push([s0,R]); s0=R+RAMP; } }); cuts.push([s0,edgeR(b)-2]);
    cuts.forEach(([s0,s1])=>{
      const len=s1-s0; if(len<1) return;
      const geo=new THREE.PlaneGeometry(w,len); geo.rotateX(-Math.PI/2);
      const y=groundY((s0+s1)/2)+0.02, m=flat(geo,stone,y), mid=P(b,(s0+s1)/2,y);
      m.position.set(mid.x,mid.y,mid.z); m.rotation.y=-b*DEG; g.add(m);
    });
  });

})();

/* ---------- shapes and helpers for landmarks ---------- */
const OCT=new THREE.CylinderGeometry(1,1,1,8).rotateY(Math.PI/8).translate(0,.5,0);
const octTaper=top=>new THREE.CylinderGeometry(top,1,1,8).rotateY(Math.PI/8).translate(0,.5,0);

const DISC=new THREE.CylinderGeometry(1,1,1,56).translate(0,.5,0);
const CURTAIN=new THREE.CylinderGeometry(1,1,1,40,1,true).translate(0,.5,0);
const BASIN=new THREE.CylinderGeometry(1,.42,1,32).translate(0,.5,0);
const BALL=new THREE.SphereGeometry(1,16,10);
const UP=new THREE.Vector3(0,1,0);
function adder(g){ return (geo,mat,x,y,z,sx,sy,sz,ry)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); if(ry) m.rotation.y=ry; g.add(m); return m; }; }
const waterMat=()=>lam("#4f9fcf",{emissive:new THREE.Color("#163e58")});
const curtainMat=new THREE.MeshLambertMaterial({color:0xdff1ff,transparent:true,opacity:.36,side:THREE.DoubleSide,depthWrite:false});
const sprayMat=new THREE.MeshLambertMaterial({color:0xeaf6ff,transparent:true,opacity:.55,depthWrite:false});
const goldMat=()=>lam("#d8b34a",{emissive:new THREE.Color("#2a1e04")});

let tween=null;
function nearestAngle(from,to){ let d=(to-from)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return from+d; }
function flyTo(target,dist,opt){
  opt=opt||{};
  const fromT=controls.target.clone(), s=new THREE.Spherical().setFromVector3(camera.position.clone().sub(fromT));
  dist=Math.min(controls.maxDistance,Math.max(controls.minDistance,dist));
  tween={t0:performance.now(),dur:reduced?1:1100,fromT,toT:target.clone(),
    fromD:s.radius,toD:dist,fromPhi:s.phi,toPhi:opt.phi!==undefined?opt.phi:TILT,
    fromTh:s.theta,toTh:opt.theta!==undefined?nearestAngle(s.theta,opt.theta):s.theta};
}
function stepTween(now){
  let k=(now-tween.t0)/tween.dur; if(!(k<1)) k=1;
  const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2, T=tween;
  const tt=new THREE.Vector3().lerpVectors(T.fromT,T.toT,e);
  const d=Math.exp(Math.log(T.fromD)+(Math.log(T.toD)-Math.log(T.fromD))*e);
  controls.target.copy(tt);
  camera.position.setFromSpherical(new THREE.Spherical(d,T.fromPhi+(T.toPhi-T.fromPhi)*e,T.fromTh+(T.toTh-T.fromTh)*e)).add(tt);
  if(k===1) tween=null;
}

const TIER_MAX={1:1e9,2:1150,3:560};
const _v=new THREE.Vector3();
function updateLabels(){
  const w=host.clientWidth,h=host.clientHeight, dist=camera.position.distanceTo(controls.target);
  // place labels in priority order (selected, then tier 1, 2, 3); skip any that would overlap one already placed
  const sk=selKey();
  const order=labels.slice().sort((a,b)=>(a.id===sk?-1:0)-(b.id===sk?-1:0)||a.tier-b.tier);
  const placed=[];
  for(const l of order){
    let show=labelsOn&&!l.off&&!(l.id.startsWith("person:")&&!peopleOn)&&(dist<TIER_MAX[l.tier]||l.id===sk), x=0, y=0;
    if(show){ _v.copy(l.pos).project(camera); if(_v.z>1||Math.abs(_v.x)>1.1||Math.abs(_v.y)>1.1) show=false; }
    if(show){
      if(!l.w){ l.el.hidden=false; l.w=l.el.offsetWidth; l.h=l.el.offsetHeight; }
      x=(_v.x+1)/2*w; y=(1-_v.y)/2*h;
      const r={x0:x-l.w/2-3,x1:x+l.w/2+3,y0:y-l.h-2,y1:y+2};
      if(placed.some(o=>r.x0<o.x1&&r.x1>o.x0&&r.y0<o.y1&&r.y1>o.y0)) show=false; else placed.push(r);
    }
    if(l.el.hidden===show) l.el.hidden=!show;

}

  if(Math.abs(offX-tx)<.5) offX=tx; if(Math.abs(offY-ty)<.5) offY=ty;
  const w=host.clientWidth||1, h=host.clientHeight||1;
  if(offX||offY) camera.setViewOffset(w,h,offX,offY,w,h); else if(camera.view&&camera.view.enabled) camera.clearViewOffset();
}

function sanitize(d){

  return {t:d.t,c:/^#[0-9a-f]{6}$/i.test(d.c)?d.c.toLowerCase():CAT_BY[d.t].c,
    x:num(d.x,-700,700,0),y:num(d.y,-5,200,H),z:num(d.z,-700,700,0),r:num(d.r,-100,100,0),s:num(d.s,.5,2.5,1),

}
function sanitizePiece(d){

function buildGroup(id,d){

  g.userData.mats=[];

  const b=new THREE.Box3().setFromObject(g), sz=b.getSize(new THREE.Vector3());

function dropGroup(g){ scene.remove(g); const i=pieceGroups.indexOf(g); if(i>=0) pieceGroups.splice(i,1); g.traverse(o=>{ if(o.isMesh&&!o.material.userData.shared) o.material.dispose(); }); }

function removeLocal(id){

/* --- saving: the artifact's database when the viewer provides one, otherwise this browser --- */
const Store={kind:"pending",db:null,pend:{},chain:{},cityTimer:null,cityBusy:false,cityDirty:false,lsTimer:null};
const LS_KEY=CITY.id+"-sandbox-v1";
const saveEl=$("saveState");
function setSave(s){ saveEl.textContent={saving:"Saving…",saved:"All changes saved",local:"Saved in this browser",unsaved:"Not saved",readonly:"View only"}[s]||""; }
function busy(){ return Object.keys(Store.pend).length||Store.cityBusy||Store.cityDirty; }
const WQ=[]; let wActive=0;
function enqueue(fn){ return new Promise((res,rej)=>{ WQ.push({fn,res,rej}); pumpQ(); }); }
function pumpQ(){ while(wActive<4&&WQ.length){ const j=WQ.shift(); wActive++; Promise.resolve().then(j.fn).then(j.res,j.rej).finally(()=>{ wActive--; pumpQ(); }); } }
function writeErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){ if(!readOnly){ readOnly=true; setSave("readonly"); toast("You can look around, but your account can't save changes to this sandbox."); setMode("explore"); updateModeTabs(); } }
  else if(code==="quota_exceeded") toast("The sandbox is full. Demolish some of your buildings before adding more.");
  else if(code==="revoked"||code==="not_granted"||code==="capability_disabled") { readOnly=true; setSave("readonly"); updateModeTabs(); }
  else toast("Couldn't save the last change. Check your connection, then try again.");
}
function dbWrite(id,fn){
  Store.pend[id]=(Store.pend[id]||0)+1; setSave("saving");
  const ref=Store.db.collection("pieces").doc(id);
  Store.chain[id]=(Store.chain[id]||Promise.resolve()).then(()=>enqueue(()=>fn(ref))).catch(writeErr).finally(()=>{
    if(!--Store.pend[id]){ delete Store.pend[id]; delete Store.chain[id]; } if(!busy()&&!readOnly) setSave("saved"); });
}
function saveLocalSoon(){
  clearTimeout(Store.lsTimer);
  Store.lsTimer=setTimeout(()=>{ try{ const pieces={}; PIECES.forEach((v,k)=>pieces[k]=v.d); localStorage.setItem(LS_KEY,JSON.stringify({pieces,removed:[...REMOVED]})); setSave("local"); }catch(e){ setSave("unsaved"); } },300);
}
function canWrite(){ if(readOnly){ toast("This sandbox is view only for you."); return false; } if(Store.kind==="pending"){ toast("Still loading your saved buildings. Try again in a moment."); return false; } return true; }
function commitPiece(id,d){ if(!canWrite()) return false; upsertLocal(id,d); if(Store.kind==="db") dbWrite(id,ref=>ref.set(d)); else saveLocalSoon(); return true; }
function commitDelete(id){ if(!canWrite()) return false; removeLocal(id); if(Store.kind==="db") dbWrite(id,ref=>ref.delete()); else saveLocalSoon(); return true; }
function commitRemoved(set){
  if(!canWrite()) return false; applyRemoved(set);
  if(Store.kind==="db"){ Store.cityDirty=true; setSave("saving"); clearTimeout(Store.cityTimer); Store.cityTimer=setTimeout(flushCity,500); }
  else saveLocalSoon();
  return true;
}
async function flushCity(){
  Store.cityTimer=null;
  if(Store.cityBusy){ Store.cityTimer=setTimeout(flushCity,300); return; }
  Store.cityBusy=true; Store.cityDirty=false;
  try{ await enqueue(()=>Store.db.doc("sandbox/city").set({removed:[...REMOVED]})); }catch(e){ writeErr(e); }
  Store.cityBusy=false;
  if(Store.cityDirty&&!Store.cityTimer) flushCity(); else if(!busy()&&!readOnly) setSave("saved");
}
(async function initStore(){
  let db=null;
  try{ if(window.claude&&typeof window.claude.use==="function") db=await window.claude.use("db"); }catch(e){ db=null; }
  if(db){
    Store.kind="db"; Store.db=db; setSave("saved");
    db.collection("pieces").onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        const id=ch.doc.id; if(Store.pend[id]) return;
        if(ch.type==="removed") removeLocal(id);
        else { const d=sanitizePiece(ch.doc.data()); if(d) upsertLocal(id,d); }
      });
    },()=>toast("Live updates stopped. Reload the page to see the latest buildings."));
    db.doc("sandbox/city").onSnapshot(s=>{
      if(Store.cityBusy||Store.cityDirty||Store.cityTimer) return;
      const arr=s.exists&&Array.isArray(s.data().removed)?s.data().removed.filter(k=>typeof k==="string"):[];
      applyRemoved(new Set(arr));
    },()=>{});
  } else {
    Store.kind="local";
    try{ const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");
      if(j){ Object.entries(j.pieces||{}).forEach(([id,d])=>{ d=sanitizePiece(d); if(d&&/^[\w-]{1,40}$/.test(id)) upsertLocal(id,d); }); applyRemoved(new Set(Array.isArray(j.removed)?j.removed:[])); }
    }catch(e){}
    setSave("local");
  }
  updateModeTabs();
})();

const undoS=[], redoS=[];
function record(a){ undoS.push(a); if(undoS.length>200) undoS.shift(); redoS.length=0; updUndo(); }
function applyAct(a,dir){
  if(a.k==="add") return dir<0?commitDelete(a.id):commitPiece(a.id,a.d);
  if(a.k==="del") return dir<0?commitPiece(a.id,a.d):commitDelete(a.id);
  if(a.k==="upd"){ const ok=commitPiece(a.id,dir<0?a.before:a.after); if(selPiece===a.id) renderPieceCard(); return ok; }
  if(a.k==="demo"){ const s=new Set(REMOVED); a.keys.forEach(k=>dir<0?s.delete(k):s.add(k)); return commitRemoved(s); }
}
function undo(){ const a=undoS[undoS.length-1]; if(!a) return; if(applyAct(a,-1)===false) return; redoS.push(undoS.pop()); updUndo(); }
function redo(){ const a=redoS[redoS.length-1]; if(!a) return; if(applyAct(a,1)===false) return; undoS.push(redoS.pop()); updUndo(); }
function updUndo(){ $("undoBtn").disabled=!undoS.length; $("redoBtn").disabled=!redoS.length; }
$("undoBtn").addEventListener("click",undo); $("redoBtn").addEventListener("click",redo);

/* --- highlight and selection of your own buildings --- */
function pieceHL(id,on){ const ex=PIECES.get(id); if(!ex) return; ex.g.userData.mats.forEach(m=>{ m.emissive.copy(m.userData.em); if(on) m.emissive.add(HL_EM); }); }
function selectPiece(id,fly){
  if(selected) select(null,false);
  selPerson=null;
  if(selPiece&&selPiece!==id) pieceHL(selPiece,false);
  const ex=PIECES.get(id); if(!ex) return;
  selPiece=id; pieceHL(id,true); refreshLabelOn();
  marker.visible=marker2.visible=true; marker.position.copy(ex.g.position).setY(ex.g.position.y+.5); marker2.position.copy(marker.position); marker.scale.setScalar(ex.g.userData.ring);
  renderPieceCard(); renderList();
  if(fly) flyTo(ex.g.position,Math.max(120,ex.g.userData.ring*14));
}
function deselectPiece(){
  if(!selPiece) return; pieceHL(selPiece,false); selPiece=null;
  marker.visible=marker2.visible=false; infoEl.hidden=true; refreshLabelOn(); renderList();
}
function refreshLabelOn(){ const k=selKey(); labels.forEach(l=>l.el.classList.toggle("on",l.id===k)); }

/* --- labels for buildings you have named --- */
function syncPieceLabel(id){
  const key="piece:"+id, i=labels.findIndex(l=>l.id===key), ex=PIECES.get(id);
  if(!ex||!ex.d.n){ if(i>=0){ labels[i].el.remove(); labels.splice(i,1); } return; }
  let l=labels[i];
  if(!l){ const el=document.createElement("button"); el.className="lbl t3"; el.addEventListener("click",()=>selectPiece(id,true)); labelsEl.appendChild(el); l={id:key,el,pos:new THREE.Vector3(),tier:3}; labels.push(l); }
  if(l.el.textContent!==ex.d.n){ l.el.textContent=ex.d.n; l.el.title=ex.d.n; l.w=0; }
  l.pos.copy(ex.g.position).setY(ex.g.userData.top+3);
  l.el.classList.toggle("on",selPiece===id);
}

/* --- the card for one of your buildings --- */
const degOf=r=>Math.round(((r/DEG)%360+360)%360);
function swatchesHTML(active,prefix){
  return SWATCHES.map(c=>`<button class="sw-b" style="background:${c}" data-c="${c}" aria-pressed="${c===active}" aria-label="Color ${c}"></button>`).join("")+
    `<input type="color" class="sw-c" id="${prefix}Custom" value="${active}" title="Pick any color" aria-label="Pick any color">`;
}
let editBefore=null;
function renderPieceCard(){
  const ex=PIECES.get(selPiece); if(!ex) return;
  const d=ex.d, c=CAT_BY[d.t], editing=mode==="build"&&!readOnly;
  const focusId=document.activeElement&&infoEl.contains(document.activeElement)?document.activeElement.id:null;
  infoEl.innerHTML=`<div class="info-head"><div><p class="kicker">Your building · ${esc(c.name)}</p><h2 id="pcTitle">${esc(pieceName(d))}</h2></div><button id="closeInfo" aria-label="Close">&times;</button></div>`+
  (editing?`
    <div class="field"><label for="pcName">Name</label><input id="pcName" maxlength="60" placeholder="${esc(c.name)}" value="${esc(d.n)}"></div>
    <div class="field"><label for="pcNote">Notes</label><textarea id="pcNote" rows="3" maxlength="600" placeholder="Who lives here? What happened here?">${esc(d.note)}</textarea></div>
    <div class="field"><span class="flabel">Color</span><div class="sws" id="pcSw">${swatchesHTML(d.c,"pc")}</div></div>
    <div class="field row"><label for="pcSize">Size</label><input type="range" id="pcSize" min="0.5" max="2.5" step="0.1" value="${d.s}"><output id="pcSizeOut">${d.s.toFixed(1)}×</output></div>
    <div class="field row"><span class="flabel">Turn</span><button class="mini" data-turn="-1">&minus;15°</button><output>${degOf(d.r)}°</output><button class="mini" data-turn="1">+15°</button></div>
    <div class="acts"><button id="pcMove" class="primary">Move</button><button id="pcDup">Duplicate</button><button id="pcDel" class="danger">Demolish</button></div>`
  :`${d.note?`<p class="desc">${esc(d.note)}</p>`:`<p class="desc muted">No notes yet.</p>`}
    ${readOnly?"":`<div class="acts"><button id="pcEdit" class="primary">Edit in Build mode</button></div>`}`);
  infoEl.hidden=false;
  $("closeInfo").addEventListener("click",deselectPiece);
  if(!editing){ const b=$("pcEdit"); if(b) b.addEventListener("click",()=>{ setMode("build"); setTool("edit"); renderPieceCard(); }); return; }
  const id=selPiece, curD=()=>PIECES.get(id).d;
  const commitUpd=(after,before)=>{ before=before||curD(); if(JSON.stringify(before)===JSON.stringify(after)) return; if(commitPiece(id,after)) record({k:"upd",id,before,after}); };
  // name and notes: show while typing, save and add one undo step when you leave the field
  ["pcName","pcNote"].forEach(fid=>{
    const el=$(fid), key=fid==="pcName"?"n":"note";
    el.addEventListener("focus",()=>{ editBefore=curD(); });
    el.addEventListener("input",()=>{ const d2=Object.assign({},curD(),{[key]:el.value.slice(0,key==="n"?60:600)}); upsertLocal(id,d2); if(key==="n") $("pcTitle").textContent=pieceName(d2); });
    el.addEventListener("change",()=>{ const b=editBefore||curD(); editBefore=null; const after=Object.assign({},curD()); upsertLocal(id,b); commitUpd(after,b); });
  });
  $("pcSw").addEventListener("click",e=>{ const b=e.target.closest(".sw-b"); if(b) commitUpd(Object.assign({},curD(),{c:b.dataset.c})); if(b) renderPieceCard(); });
  $("pcCustom").addEventListener("change",e=>{ commitUpd(Object.assign({},curD(),{c:e.target.value.toLowerCase()})); renderPieceCard(); });
  const size=$("pcSize");
  size.addEventListener("pointerdown",()=>{ editBefore=curD(); });
  size.addEventListener("input",()=>{ if(!editBefore) editBefore=curD(); upsertLocal(id,Object.assign({},curD(),{s:+size.value})); $("pcSizeOut").textContent=(+size.value).toFixed(1)+"×"; marker.scale.setScalar(PIECES.get(id).g.userData.ring); });
  size.addEventListener("change",()=>{ const b=editBefore||curD(); editBefore=null; const after=Object.assign({},curD(),{s:+size.value}); upsertLocal(id,b); commitUpd(after,b); });
  infoEl.querySelectorAll("[data-turn]").forEach(b=>b.addEventListener("click",()=>{ commitUpd(Object.assign({},curD(),{r:curD().r+(+b.dataset.turn)*STEP})); renderPieceCard(); }));
  $("pcMove").addEventListener("click",()=>startMove(id));
  $("pcDup").addEventListener("click",()=>{ const d0=curD(); Object.assign(cur,{t:d0.t,c:d0.c,s:d0.s,r:d0.r}); syncBuildOpts(); deselectPiece(); setTool("place"); toast("Click on the map to place the copy."); });
  $("pcDel").addEventListener("click",()=>demolishPiece(id));
  if(focusId&&$(focusId)) $(focusId).focus();
}
function demolishPiece(id){ const ex=PIECES.get(id); if(!ex) return; const d=ex.d; if(commitDelete(id)) record({k:"del",id,d}); }

/* --- ghost preview that follows the pointer while placing or moving --- */
let ghost=null, ghostKey="", lastSurf=null;
function ensureGhost(){
  const key=cur.t+"|"+cur.c;
  if(!ghost||ghostKey!==key){
    if(ghost) scene.remove(ghost);
    ghost=makePiece(cur.t,cur.c);
    ghost.traverse(o=>{ if(o.isMesh){ o.material=o.material.clone(); o.material.transparent=true; o.material.opacity=.62; o.material.depthWrite=false; o.material.userData.base=o.material.color.clone(); o.castShadow=false; o.receiveShadow=false; o.renderOrder=4; } });
    ghostKey=key; ghost.visible=false; scene.add(ghost);
  }
  ghost.scale.setScalar(cur.s); ghost.rotation.y=cur.r;
  return ghost;
}
function hideGhost(){ if(ghost) ghost.visible=false; }
function surfaceAt(cx,cy){
  const r=cv.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects([hillMesh,groundMesh,...TIERS],false)[0]; if(!h) return null;
  const p=h.point.clone(); if(snapOn){ p.x=Math.round(p.x); p.z=Math.round(p.z); }
  const ok=h.face.normal.y>0.86&&Math.hypot(p.x,p.z)<640;
  return {p,ok};
}
function updateGhost(s){
  if(!(mode==="build"&&(tool==="place"||moving))||!s){ hideGhost(); return; }
  const g=ensureGhost(); g.visible=true; g.position.copy(s.p);
  g.traverse(o=>{ if(o.isMesh) o.material.color.copy(s.ok?o.material.userData.base:BAD); });
}
function placeAt(s){
  if(!s) return;
  if(!s.ok){ toast("That ground is too steep. Build on the summit or out on the plain."); return; }
  const pos={x:+s.p.x.toFixed(2),y:+s.p.y.toFixed(2),z:+s.p.z.toFixed(2)};
  if(moving){
    const id=moving, ex=PIECES.get(id); if(!ex){ endMove(false); return; }
    const before=ex.d, after=Object.assign({},before,pos,{r:cur.r});
    endMove(false); if(commitPiece(id,after)) record({k:"upd",id,before,after}); selectPiece(id,false); return;
  }
  const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const d=Object.assign({t:cur.t,c:cur.c,s:cur.s,r:cur.r,n:"",note:"",at:Date.now()},pos);
  if(commitPiece(id,d)) record({k:"add",id,d});
}
let moveRestore=null;
function startMove(id){
  const ex=PIECES.get(id); if(!ex||!canWrite()) return;
  moveRestore={t:cur.t,c:cur.c,s:cur.s,r:cur.r};
  Object.assign(cur,{t:ex.d.t,c:ex.d.c,s:ex.d.s,r:ex.d.r});
  deselectPiece(); moving=id; ex.g.visible=false; setTool("edit"); updateHint();
  ensureGhost(); toast("Click where it should go. Press Esc to cancel.");
}
function endMove(restoreVisible){
  if(!moving) return; const ex=PIECES.get(moving); if(ex) ex.g.visible=true;
  moving=null; if(moveRestore){ Object.assign(cur,moveRestore); moveRestore=null; } hideGhost(); syncBuildOpts(); updateHint();
}

/* --- demolish preview: tint what would be removed --- */
let demoHover=null;
function setDemoHover(h){
  const key=h?(h.kind==="piece"?"p:"+h.id:h.kind==="lot"?"l:"+h.key:null):null;
  if(demoHover&&demoHover.key===key) return;
  if(demoHover){ if(demoHover.kind==="piece") pieceHL(demoHover.id,selPiece===demoHover.id); else tintLot(demoHover.k,false); }
  demoHover=null; if(!key) return;
  if(h.kind==="piece"){ const ex=PIECES.get(h.id); if(ex) ex.g.userData.mats.forEach(m=>m.emissive.set("#7a1a10")); demoHover={key,kind:"piece",id:h.id}; }
  else { tintLot(h.key,true); demoHover={key,kind:"lot",k:h.key}; }
}
function tintLot(k,on){ (LOTMAP.get(k)||[]).forEach(e=>{ const inst=INST.find(x=>x.mesh===e.mesh); e.mesh.setColorAt(e.i,on?BAD:inst.base[e.i]); e.mesh.instanceColor.needsUpdate=true; }); }

/* --- what is under the pointer --- */
function hitAt(cx,cy){
  const r=cv.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pieceGroups.filter(g=>g.visible).concat(pickables,peopleOn?peopleSprites.filter(s=>s.visible):[]),true);
  for(const h of hits){
    const o=h.object;
    if(o.isSprite&&o.userData.personId!==undefined) return {kind:"person",id:o.userData.personId};
    if(o.userData.pieceId) return {kind:"piece",id:o.userData.pieceId};
    if(o.isInstancedMesh&&o.userData.owners&&h.instanceId!==undefined){
      const k=o.userData.lots&&o.userData.lots[h.instanceId];
      return k?{kind:"lot",key:k,id:o.userData.owners[h.instanceId]}:{kind:"place",id:o.userData.owners[h.instanceId]};
    }
    if(o.userData.placeId) return {kind:"place",id:o.userData.placeId};
  }
  return null;
}
const hitName=h=>h.kind==="person"?personInfo(h.id).name:h.kind==="piece"?pieceName(PIECES.get(h.id).d):PLACES[h.id]?PLACES[h.id].name:"";

/* --- pointer handling for both modes --- */
const cv=renderer.domElement; let down=null, hoverQueued=null;
cv.addEventListener("contextmenu",e=>{ if(mode==="build") e.preventDefault(); });
cv.addEventListener("pointerdown",e=>{ down={x:e.clientX,y:e.clientY,b:e.button}; tip.hidden=true; });
cv.addEventListener("pointerup",e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), btn=down.b; down=null;
  if(moved>=6) return;
  if(btn===2){ if(mode==="build"){ if(moving) endMove(false); else if(tool==="place") setTool("edit"); } return; }
  if(btn!==0) return;
  if(mode==="build"&&(tool==="place"||moving)){ placeAt(surfaceAt(e.clientX,e.clientY)); return; }
  const h=hitAt(e.clientX,e.clientY);
  if(mode==="build"&&tool==="demolish"){
    setDemoHover(null);
    if(!h) return;
    if(h.kind==="person") toast("People can't be demolished. They live here.");
    else if(h.kind==="piece") demolishPiece(h.id);
    else if(h.kind==="lot"){ const s=new Set(REMOVED); s.add(h.key); if(commitRemoved(s)) record({k:"demo",keys:[h.key]}); }
    else toast(`${PLACES[h.id]?PLACES[h.id].name:"That"} is part of the story, so it stays standing.`);
    return;
  }
  if(h&&h.kind==="person") selectPerson(h.id,false);
  else if(h&&h.kind==="piece") selectPiece(h.id,false);
  else if(h&&mode==="explore") select(h.id);
  else if(h&&mode==="build") select(h.id,false);
  else { clearPerson(); if(selPiece) deselectPiece(); if(selected) select(null,false); }
});
cv.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch"){ tip.hidden=true; return; }
  if(e.buttons){ tip.hidden=true; if(!(mode==="build"&&(tool==="place"||moving))) return; }
  hoverQueued={x:e.clientX,y:e.clientY};
});
cv.addEventListener("pointerleave",()=>{ hoverQueued=null; tip.hidden=true; cv.style.cursor=""; hideGhost(); setDemoHover(null); });
function doHover(){
  if(!hoverQueued) return; const {x,y}=hoverQueued; hoverQueued=null;
  if(mode==="build"&&(tool==="place"||moving)){ lastSurf=surfaceAt(x,y); updateGhost(lastSurf); tip.hidden=true; cv.style.cursor=lastSurf&&lastSurf.ok?"crosshair":"not-allowed"; return; }
  const h=hitAt(x,y);
  let text=h?hitName(h):"";
  if(mode==="build"&&tool==="demolish"){ setDemoHover(h&&h.kind!=="place"?h:null); text=h?(h.kind==="place"||h.kind==="person"?`${text} can't be demolished`:`Demolish ${h.kind==="lot"?"this building":text}`):""; }
  cv.style.cursor=h?"pointer":"";
  if(text){ const r=$("app").getBoundingClientRect(); tip.textContent=text; tip.hidden=false; tip.style.left=(x-r.left+14)+"px"; tip.style.top=(y-r.top+14)+"px"; }
  else tip.hidden=true;
}

palEl.addEventListener("click",e=>{ const b=e.target.closest(".card"); if(!b) return; if(moving) endMove(false); cur.t=b.dataset.t; cur.c=CAT_BY[cur.t].c; syncBuildOpts(); setTool("place"); if(narrowMQ.matches) setPlacesOpen(false); });
$("curSw").addEventListener("click",e=>{ const b=e.target.closest(".sw-b"); if(!b) return; cur.c=b.dataset.c; syncBuildOpts(); });
$("curSw").addEventListener("change",e=>{ if(e.target.type==="color"){ cur.c=e.target.value.toLowerCase(); syncBuildOpts(); } });
$("sizeIn").addEventListener("input",e=>{ cur.s=+e.target.value; syncBuildOpts(); });
$("rotMinus").addEventListener("click",()=>turn(-1)); $("rotPlus").addEventListener("click",()=>turn(1));

function syncBuildOpts(){
  palEl.querySelectorAll(".card").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===cur.t&&tool==="place")));

function turn(dir){
  if(mode!=="build") return;
  if(tool==="place"||moving){ cur.r+=dir*STEP; syncBuildOpts(); if(ghost) ghost.rotation.y=cur.r; return; }
  if(selPiece){ const ex=PIECES.get(selPiece), before=ex.d, after=Object.assign({},before,{r:before.r+dir*STEP}); if(commitPiece(selPiece,after)) record({k:"upd",id:selPiece,before,after}); renderPieceCard(); }
}
function resizeBy(ds){
  if(mode!=="build") return;
  if(tool==="place"||moving){ cur.s=Math.min(2.5,Math.max(.5,+(cur.s+ds).toFixed(1))); syncBuildOpts(); return; }
  if(selPiece){ const ex=PIECES.get(selPiece), before=ex.d, after=Object.assign({},before,{s:Math.min(2.5,Math.max(.5,+(before.s+ds).toFixed(1)))}); if(commitPiece(selPiece,after)) record({k:"upd",id:selPiece,before,after}); renderPieceCard(); }
}
$("buildPane").querySelector(".tools").addEventListener("click",e=>{ const b=e.target.closest("[data-tool]"); if(b) setTool(b.dataset.tool); });
function setTool(t){

/* toast */
let toastT=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; },3800); }

/* keyboard */
document.addEventListener("keydown",e=>{
  const ae=document.activeElement, typing=ae&&(/^(TEXTAREA|SELECT)$/.test(ae.tagName)||(ae.tagName==="INPUT"&&!/^(range|checkbox|color|button)$/.test(ae.type)));
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!typing&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&!typing&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }

    if(selPiece){ deselectPiece(); return; }
    if(selected) select(null,false); return;

/* ---------- daily life: a city clock, a street map people plan routes on, and a schedule for every role ---------- */
// clock: game minutes since the first midnight. Starts at 08:00. clockRate is game minutes per real second.
let clock=8*60, clockRate=1, clockPaused=false;
const hourOf=m=>(((m%1440)+1440)%1440)/60;
const untilHour=h=>clock+((((h*60-clock)%1440)+1440)%1440||1440);

/* the street map: junctions where avenues meet ring roads, joined by stretches of road */
const SQ_RING=CITY.routines.squareRing;                       // the ring walk around the central square
const RINGS_WALK=[SQ_RING,...RING_ROADS.map(r=>r[0])];
const aveEnd=a=>edgeR(a.b)-10;
const ringsOn=a=>RINGS_WALK.filter(R=>a.r0<=R+1);
const NODES=[], EDGES=[], NODE_ID={};
const node=key=>{ if(NODE_ID[key]===undefined){ NODE_ID[key]=NODES.length; NODES.push({key,adj:[]}); } return NODE_ID[key]; };
function addEdge(e){ e.id=EDGES.length; EDGES.push(e); NODES[e.u].adj.push(e); NODES[e.v].adj.push(e); }
RINGS_WALK.forEach(R=>{ const js=AVENUES.filter(a=>a.r0<=R+1).map(a=>a.b).sort((x,y)=>x-y);
  js.forEach((b,i)=>{ const b2=js[(i+1)%js.length], d=((b2-b)%360+360)%360||360;
    addEdge({kind:"ring",R,b0:b,d,u:node("J"+R+":"+b),v:node("J"+R+":"+b2),len:R*d*DEG}); }); });
AVENUES.forEach(a=>{ const stops=ringsOn(a).concat([aveEnd(a)]), key=r=>RINGS_WALK.includes(r)?"J"+r+":"+a.b:"E:"+a.b;
  for(let i=0;i<stops.length-1;i++) addEdge({kind:"ave",a,r0:stops[i],r1:stops[i+1],u:node(key(stops[i])),v:node(key(stops[i+1])),len:stops[i+1]-stops[i]}); });
function edgePoint(e,t,lane,out){
  if(e.kind==="ring"){ const q=P(e.b0+t*e.d,e.R+lane*(e.R===SQ_RING?1:1.6)); return out.set(q.x,groundY(e.R),q.z); }
  const r=e.r0+t*(e.r1-e.r0), q=P(e.a.b,r), s=lane*(e.a.w/2-.7);
  return out.set(q.x+Math.cos(e.a.b*DEG)*s,streetY(r),q.z+Math.sin(e.a.b*DEG)*s);
}
function nearestStreet(x,z){
  const b=bearingOf(x,z); let best=null;
  for(const e of EDGES){
    let t,px,pz;
    if(e.kind==="ring"){ const rel=((b-e.b0)%360+360)%360; t=rel<=e.d?rel/e.d:(rel-e.d<360-rel?1:0); const q=P(e.b0+t*e.d,e.R); px=q.x; pz=q.z; }
    else { const ux=Math.sin(e.a.b*DEG), uz=-Math.cos(e.a.b*DEG), rr=Math.min(e.r1,Math.max(e.r0,x*ux+z*uz)); t=(rr-e.r0)/(e.r1-e.r0); px=ux*rr; pz=uz*rr; }
    const d=(px-x)**2+(pz-z)**2; if(!best||d<best.d) best={e,t,d};
  }

}
function route(from,to){ // shortest way between two points on the streets, as stretches of road
  if(from.e===to.e) return [{e:from.e,t0:from.t,t1:to.t}];
  const n=NODES.length, dist=new Array(n).fill(Infinity), prev=new Array(n).fill(null), done=new Array(n).fill(false);
  dist[from.e.u]=from.t*from.e.len; prev[from.e.u]={start:0};
  const dv=(1-from.t)*from.e.len; if(dv<dist[from.e.v]){ dist[from.e.v]=dv; prev[from.e.v]={start:1}; }
  for(;;){ let k=-1; for(let i=0;i<n;i++) if(!done[i]&&dist[i]<Infinity&&(k<0||dist[i]<dist[k])) k=i; if(k<0) break; done[k]=true;
    for(const e of NODES[k].adj){ const o=e.u===k?e.v:e.u, nd=dist[k]+e.len; if(nd<dist[o]){ dist[o]=nd; prev[o]={node:k,e}; } } }
  const cu=dist[to.e.u]+to.t*to.e.len, cv=dist[to.e.v]+(1-to.t)*to.e.len, end=cu<=cv?to.e.u:to.e.v;
  const segs=[{e:to.e,t0:end===to.e.u?0:1,t1:to.t}];
  let k=end;
  while(prev[k]&&prev[k].node!==undefined){ const {node:pk,e}=prev[k]; segs.unshift({e,t0:pk===e.u?0:1,t1:k===e.u?0:1}); k=pk; }
  segs.unshift({e:from.e,t0:from.t,t1:prev[k]&&prev[k].start===1?1:0});
  return segs;
}

/* people */
const people=[], peopleSprites=[];
const prng=mulberry32(1510);
const pickOne=a=>a[Math.floor(prng()*a.length)];
function chooseNear(w,list,k){ let best=null,bd=1e18; for(let i=0;i<(k||3);i++){ const c=pickOne(list), p=c.pos||c, d=p.distanceToSquared(w.pos); if(d<bd){ bd=d; best=c; } } return best; }

/* moving: a path is a list of stretches of road and short walks off the road */
const segLen=s=>s.kind==="free"?s.a.distanceTo(s.b):Math.abs(s.t1-s.t0)*s.e.len;
function segPoint(w,s,f,out){ return s.kind==="free"?out.lerpVectors(s.a,s.b,f):edgePoint(s.e,s.t0+(s.t1-s.t0)*f,w.lane,out); }
function goTo(w,target,arrive,going,instant){
  if(!w.loc&&!w.offAt) w.offAt={pos:w.pos.clone(),access:nearestStreet(w.pos.x,w.pos.z)};
  const end=nearestStreet(target.x,target.z);
  const finish=()=>{ w.offAt={pos:target.clone(),access:end}; w.loc=null; arrive(); };
  w.inside=false; w.act=null; w.doing=going;
  if(instant||reduced){ w.segs=[]; w.pos.copy(target); finish(); return; }
  const segs=[]; let start=w.loc;
  if(w.offAt){ start=w.offAt.access; segs.push({kind:"free",a:w.pos.clone(),b:edgePoint(start.e,start.t,w.lane,new THREE.Vector3())}); }
  route(start,end).forEach(r=>segs.push({kind:"edge",e:r.e,t0:r.t0,t1:r.t1}));
  segs.push({kind:"free",a:edgePoint(end.e,end.t,w.lane,new THREE.Vector3()),b:target.clone()});
  w.segs=segs.map(s=>Object.assign(s,{len:segLen(s)})).filter(s=>s.len>1e-3); w.sd=0; w.onArrive=finish;
  if(!w.segs.length){ w.onArrive=null; finish(); }
}
function moveAlong(w,dist){
  while(dist>0&&w.segs.length){
    const s=w.segs[0], left=s.len-w.sd;
    if(dist<left){ w.sd+=dist; segPoint(w,s,w.sd/s.len,w.pos); return; }
    dist-=left; segPoint(w,s,1,w.pos); w.segs.shift(); w.sd=0;
  }
  if(!w.segs.length&&w.onArrive){ const f=w.onArrive; w.onArrive=null; f(); }
}
// go somewhere, then do something there until a given time
function doAt(w,pos,act,going,at,instant){ goTo(w,pos,()=>{ w.act=act; w.inside=act.kind==="inside"; w.doing=at; if(act.onStart) act.onStart(); },going,instant); }
function homeOf(w){ if(!w.home||REMOVED.has(w.home.l)) w.home=chooseNear(w,HOMES.map(h=>({pos:V(h.x,h.z),l:h.l})),6); return w.home; }
function goHome(w,until,at,instant){ doAt(w,homeOf(w).pos,{kind:"inside",until},"Walking home",at||"At home",instant); }
const stay=(until,c,R)=>({kind:"stay",until,wander:c?{c,R}:null,next:0});

// what townsfolk do with their free time
function outing(w,instant){
  const h=hourOf(clock);
  if(h>=21.5||h<6) return goHome(w,untilHour(6)+prng()*90,"Asleep at home",instant);
  if(prng()<.12) return goHome(w,clock+20+prng()*40,"Resting at home",instant);
  const r=prng();
  const market=()=>{ if(!MARKETS.length) return plaza(); const m=chooseNear(w,MARKETS); doAt(w,around(m.pos,3.5,7),stay(clock+20+prng()*40,m.pos,6),"Walking to the market","Shopping at the market in "+quarterOf(m.pos),instant); };
  const garden=()=>{ const g=chooseNear(w,GARDENS); doAt(w,around(g.pos,0,g.R*.5),stay(clock+20+prng()*50,g.pos,g.R*.5),"Going for a walk in a garden","Strolling in a garden in "+quarterOf(g.pos),instant); };
  const plaza=()=>{ const p=chooseNear(w,PLAZAS); doAt(w,around(p.pos,3.8,p.PR-1),stay(clock+15+prng()*35,p.pos,p.PR-1.2),"Walking to a fountain square","Resting by the fountain in "+quarterOf(p.pos),instant); };
  const SC=CITY.routines.squareCrowd;
  const square=()=>doAt(w,around(SQUARE,SC[0],SC[1]),stay(clock+20+prng()*50,SQUARE,SC[1]-1),"Walking up to "+CITY.text.square,"Gathering in "+CITY.text.square,instant);
  const music=()=>{ const ms=people.filter(m=>m.performing); if(!ms.length) return plaza(); const m=chooseNear(w,ms.map(x=>({pos:x.performing})),4);
    doAt(w,around(m.pos,2.2,4.5),stay(clock+20+prng()*40),"Going to hear a minstrel","Listening to a minstrel play",instant); };
  if(h<7) return r<.6?plaza():garden();
  if(h<11.5) return r<.6&&marketOpen()?market():r<.75?garden():plaza();
  if(h<14) return r<.5?square():r<.75&&marketOpen()?market():plaza();
  if(h<18) return r<.35?garden():r<.6?plaza():r<.75?square():marketOpen()?market():plaza();
  return r<.5?music():r<.8?plaza():square();
}
const ROLE_PLAN={
