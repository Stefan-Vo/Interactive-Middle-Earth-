<style>
/* Layout: one full-screen illustrated map per age; tabs and title float at the top, a lore card opens beside a clicked place.
   A deliberate single look: an inked map on parchment, the same in light and dark. */
:root{
  --parch:#efe3c4; --parch-d:#e2d1a6; --ink:#3b2a1a; --ink-soft:#6b5640; --red:#8c2f1b; --gold:#b88a2c;
  --sea:#c3d2c9; --sea-d:#9fb7ae; --river:#4f7f97; --leaf:#8a9963;
  --f-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-body:"IM Fell English",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px}
#app{position:relative;height:100%;overflow:hidden;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transform-origin:0 0;will-change:transform}
#map.dragging{cursor:grabbing}
#paper{position:absolute;inset:0;pointer-events:none;opacity:.26;background-size:256px 256px}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(70,45,20,.28) 100%)}
.sheet{background:rgba(239,227,196,.95);border:1px solid rgba(59,42,26,.35);box-shadow:0 6px 20px rgba(59,42,26,.25)}

#top{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:3}
#title{pointer-events:auto;padding:10px 16px 12px;border-radius:4px;max-width:380px}
#title h1{margin:0;font-family:var(--f-sc);font-weight:400;font-size:28px;letter-spacing:.06em;line-height:1}
#title p{margin:6px 0 0;font-style:italic;color:var(--ink-soft);font-size:15px;line-height:1.3}
#tabs{pointer-events:auto;display:flex;border-radius:4px;overflow:hidden}
#tabs button{font:inherit;font-family:var(--f-sc);font-size:16px;letter-spacing:.04em;border:0;background:transparent;color:var(--ink);padding:9px 16px;cursor:pointer}
#tabs button[aria-selected="true"]{background:var(--red);color:var(--parch)}
#tabs button:focus-visible,#controls button:focus-visible,.place:focus-visible,#card a:focus-visible,#card button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

#card{position:absolute;right:16px;top:86px;width:330px;max-width:calc(100% - 32px);padding:16px 18px 16px;border-radius:4px;z-index:3;box-sizing:border-box}
#card .kicker{margin:0;font-family:var(--f-sc);letter-spacing:.12em;font-size:13px;color:var(--red)}
#card h2{margin:2px 0 0;font-family:var(--f-sc);font-weight:400;font-size:26px;line-height:1.1;text-wrap:balance}
#card .alt{margin:4px 0 0;font-style:italic;color:var(--ink-soft)}
#card .lore{margin:10px 0 0;line-height:1.4}
#card .go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 14px;background:var(--red);color:var(--parch);text-decoration:none;font-family:var(--f-sc);letter-spacing:.06em;border-radius:3px}
#card .soon{display:inline-block;margin-top:14px;padding:5px 10px;border:1px dashed var(--ink-soft);color:var(--ink-soft);font-style:italic;border-radius:3px}
#card .close{position:absolute;top:8px;right:8px;width:30px;height:30px;border:1px solid rgba(59,42,26,.3);background:transparent;color:var(--ink);font-size:18px;border-radius:3px;cursor:pointer}

#controls{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
#controls button{width:38px;height:38px;border-radius:3px;font:inherit;font-size:20px;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
#legend{position:absolute;left:16px;bottom:16px;padding:9px 12px;border-radius:4px;font-size:14px;z-index:3;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 100px)}
#legend span{display:flex;align-items:center;gap:8px}
#legend svg{flex:none}
#legend .note{color:var(--ink-soft);font-style:italic;font-size:13px}
#tip{position:absolute;z-index:4;pointer-events:none;padding:3px 8px;border-radius:3px;font-size:14px}

/* the map's ink */
.land{fill:var(--parch);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.coastA{fill:none;stroke:var(--sea-d);stroke-width:26;stroke-linejoin:round;opacity:.45}
.coastB{fill:none;stroke:var(--sea-d);stroke-width:14;stroke-linejoin:round;opacity:.5}
.coastC{fill:none;stroke:#d4ddd2;stroke-width:6;stroke-linejoin:round}
.lake{fill:var(--sea);stroke:var(--ink);stroke-width:1}
.river{fill:none;stroke:var(--river);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.peak{fill:var(--parch);stroke:var(--ink);stroke-width:.9;stroke-linejoin:round}
.hatch{fill:none;stroke:var(--ink);stroke-width:.6;opacity:.75}
.tree{fill:var(--leaf);stroke:var(--ink);stroke-width:.55}
.trunk{stroke:var(--ink);stroke-width:.6}
.region{font-family:var(--f-sc);fill:var(--red);text-anchor:middle;letter-spacing:.35em;paint-order:stroke;stroke:var(--parch);stroke-width:3px;stroke-linejoin:round;stroke-opacity:.85}
.seaname{font-family:var(--f-sc);fill:#4a6a72;opacity:.8;text-anchor:middle;letter-spacing:.4em}
.rivername{font-family:var(--f-body);font-style:italic;fill:var(--river);font-size:8px}
.plabel{font-family:var(--f-body);fill:var(--ink);font-size:9.5px;paint-order:stroke;stroke:var(--parch);stroke-width:2.6px;stroke-linejoin:round}
.plabel.built{font-family:var(--f-sc);font-size:12px;fill:var(--red)}
.plabel.soon{font-style:italic;fill:var(--ink-soft)}
.place{cursor:pointer}
.place .hit{fill:transparent}
.place.built .seal{fill:var(--red);stroke:var(--gold);stroke-width:1.6}
.place.built .ring{fill:none;stroke:var(--red);stroke-width:1;opacity:.6}
.place.soon .dot{fill:var(--parch);stroke:var(--ink-soft);stroke-width:1.1}
.place:hover .plabel,.place.on .plabel{text-decoration:underline}
.place.on .seal,.place.on .dot{stroke:var(--gold);stroke-width:2.4}
.minor-off .minor,.fine-off .fine{display:none}
/* the painted style (Beleriand) */
.painted .region{stroke-width:2.6px;stroke-opacity:.8;font-weight:400}
.painted .rivername{fill:#2a5f8f;paint-order:stroke;stroke:#f3e6b8;stroke-width:2px;stroke-opacity:.8;stroke-linejoin:round}
.painted .pname{font-family:var(--f-body);font-style:italic;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:rgba(243,230,184,.7);stroke-width:1.6px;stroke-linejoin:round}
.painted .seaname{fill:#2f5b8c;opacity:.85;letter-spacing:.25em}
.painted .seaname.vertical{letter-spacing:0}
.painted .plabel{stroke:#f4e6b4}
.painted-c rect{fill:#f5ead0;stroke:#5a3b22}
.painted-c .t{fill:#a3361f;letter-spacing:.08em}
.cartouche rect{fill:var(--parch);stroke:var(--ink);stroke-width:1.2}
.cartouche .t{font-family:var(--f-sc);fill:var(--ink);text-anchor:middle}
.cartouche .s{font-family:var(--f-body);font-style:italic;fill:var(--ink-soft);text-anchor:middle}
@media (prefers-reduced-motion: no-preference){ .place.built .ring{animation:pulse 2.4s ease-out infinite} }
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.place.built .ring{transform-box:fill-box;transform-origin:center}

@media (max-width:720px){
  #top{flex-direction:column;align-items:stretch}
  #title{max-width:none;padding:8px 12px}
  #title h1{font-size:22px}
  #title p{display:none}
  #tabs button{flex:1;padding:8px 6px;font-size:14px}
  #card{top:auto;bottom:14px;right:12px;left:12px;width:auto;max-height:52%;overflow:auto}
  #legend{display:none}
}
</style>

    </button>
  </div>

</div>

// an age traced from a reference map keeps that map's pixel positions; scale them onto the sheet once
function fromRef(A){
  const [sx,sy]=A.ref, P=p=>p.length>2?[p[0]*sx,p[1]*sy,...p.slice(2)]:[p[0]*sx,p[1]*sy], L=a=>a.map(P);
  A.land=L(A.land); A.islands=A.islands.map(L);
  [...A.lakes,...(A.tints||[])].forEach(l=>{ l.c=P(l.c); l.r=[l.r[0]*sx,l.r[1]*sy]; });
  A.mountains.forEach(m=>{ m.pts=L(m.pts); }); (A.rings||[]).forEach(r=>{ r.c=P(r.c); r.r*=sx; });
  A.peaks=L(A.peaks); A.forests.forEach(f=>{ f.pts=L(f.pts); }); (A.hills||[]).forEach(h=>{ h.pts=L(h.pts); }); (A.roads||[]).forEach(r=>{ r.pts=L(r.pts); });
  A.rivers.forEach(r=>{ if(r.pts) r.pts=L(r.pts); if(r.parts) r.parts=r.parts.map(L); if(r.at) r.at=P(r.at); });
  ["regions","names","seas"].forEach(k=>(A[k]||[]).forEach(e=>{ e[1]*=sx; e[2]*=sy; if(e[4]==="v"){ e[5]*=sx; e[6]*=sy; } }));
  A.places.forEach(p=>{ p.x=Math.round(p.x*sx); p.y=Math.round(p.y*sy); });
  if(A.cartouche) A.cartouche=P(A.cartouche); if(A.compass) A.compass=P(A.compass);
  delete A.ref;
}
Object.values(AGES).forEach(A=>{ if(A.ref) fromRef(A); });

  // mountains along their ranges, plus single great peaks, back to front
  const peaks=[];
  A.mountains.forEach(m=>{ wobble(m.pts,rnd,6.5*m.s,1.5,false).forEach((p,i)=>{ peaks.push([p[0]+(rnd()-.5)*4,p[1]+(rnd()-.5)*5,m.s]); if(m.s>1&&i%2) peaks.push([p[0]+(rnd()-.5)*10,p[1]+5+rnd()*5,m.s*.8]); }); });
  (A.rings||[]).forEach(rg=>{ for(let a=0;a<360;a+=10){ const t=a*Math.PI/180; peaks.push([rg.c[0]+Math.cos(t)*rg.r,rg.c[1]+Math.sin(t)*rg.r*.8+4,rg.s]); } });
  (A.peaks||[]).forEach(([x,y,s])=>peaks.push([x,y,s]));
  peaks.sort((a,b)=>a[1]-b[1]).forEach(([x,y,s])=>{ out+=peak(x,y,s,rnd); });
  (A.peaks||[]).forEach(([x,y,s,name])=>{ if(name) out+=`<text class="rivername minor" style="fill:#3b2a1a" x="${x+10*s}" y="${y-4}">${esc(name)}</text>`; });
  // names of regions and seas
  A.regions.forEach(([t,x,y,s])=>{ out+=`<text class="region" x="${x}" y="${y}" font-size="${s}">${esc(t.toUpperCase())}</text>`; });
  A.seas.forEach(([t,x,y,s,rot])=>{ out+=`<text class="seaname" x="${x}" y="${y}" font-size="${s}" transform="rotate(${rot} ${x} ${y})">${esc(t)}</text>`; });
  out+=placesSVG(A);
  // a cartouche with the map's title, and a compass rose
  out+=`<g class="cartouche" transform="translate(${key==="beleriand"?820:830},${key==="beleriand"?740:470})"><rect x="-110" y="-30" width="220" height="56" rx="3"/><rect x="-104" y="-24" width="208" height="44" rx="2" style="fill:none"/>
    <text class="t" y="-3" font-size="16">${esc(A.title)}</text><text class="s" y="14" font-size="10.5">${esc(A.sub)}</text></g>`;
  const cx=key==="beleriand"?935:205, cy=key==="beleriand"?762:655;      // the compass sits out at sea
  out+=`<g transform="translate(${cx},${cy})" aria-hidden="true"><circle r="20" fill="none" stroke="#3b2a1a" stroke-width=".8"/>
    <path d="M0,-26L4,0L0,26L-4,0Z" fill="#3b2a1a"/><path d="M-26,0L0,4L26,0L0,-4Z" fill="#efe3c4" stroke="#3b2a1a" stroke-width=".7"/>
    <text y="-30" text-anchor="middle" font-family="IM Fell English SC,serif" font-size="10" fill="#8c2f1b">N</text></g>`;
  return `<g id="world">${out}</g>`;
}

/* ---------- pan and zoom ---------- */
const drawn={};   // each age is drawn once and kept
let view={x:0,y:0,k:1}, shown={x:0,y:0,k:1}, settle=0, lastDraw=0, age="middle-earth";
function sheet(){ const r=document.getElementById("app").getBoundingClientRect(), s=Math.min(r.width/W,r.height/H); return {r,s,ox:(r.width-W*s)/2,oy:(r.height-H*s)/2}; }
// While the map moves, the picture already drawn is slid and scaled as a whole (cheap); the map is redrawn
// at the new view once it settles, or every half second during a long drag.
function apply(){ const {s,ox,oy}=sheet(), a=view.k/shown.k;
  svg.style.transform=`translate(${f1(ox+s*view.x-a*(ox+s*shown.x))}px,${f1(oy+s*view.y-a*(oy+s*shown.y))}px) scale(${a})`;
  clearTimeout(settle); if(performance.now()-lastDraw>800) redraw(); else settle=setTimeout(redraw,140); }
function redraw(){ clearTimeout(settle); lastDraw=performance.now(); shown={...view};
  const g=document.getElementById("world"); if(g) g.setAttribute("transform",`translate(${f1(view.x)},${f1(view.y)}) scale(${view.k})`);
  svg.style.transform=""; labelDensity(); }
function clamp(){ view.k=Math.min(8,Math.max(1,view.k)); const minX=W-W*view.k, minY=H-H*view.k; view.x=Math.min(0,Math.max(minX,view.x)); view.y=Math.min(0,Math.max(minY,view.y)); }
function toMap(cx,cy){ const {r,s,ox,oy}=sheet(); return {x:(cx-r.left-ox)/s, y:(cy-r.top-oy)/s}; }   // screen point to sheet units
function zoomAt(f,mx,my){ const k0=view.k, k1=Math.min(8,Math.max(1,k0*f)); view.x=mx-(mx-view.x)*k1/k0; view.y=my-(my-view.y)*k1/k0; view.k=k1; clamp(); apply(); }
function labelDensity(){ // hide small names until they are big enough to read
  const px=sheet().s*view.k;
  svg.classList.toggle("minor-off",px*9<8.5); svg.classList.toggle("fine-off",px*6.5<8); }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const p=toMap(e.clientX,e.clientY); zoomAt(Math.exp(-e.deltaY*.0015),p.x,p.y); },{passive:false});
const pointers=new Map(); let drag=null, pinch=null, moved=0, pressed=null;   // pressed: the place under the pointer when it went down
svg.addEventListener("pointerdown",e=>{ pressed=e.target.closest&&e.target.closest(".place"); try{ svg.setPointerCapture(e.pointerId); }catch(err){} pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0;
  if(pointers.size===1){ const p=toMap(e.clientX,e.clientY); drag={x:p.x,y:p.y,vx:view.x,vy:view.y}; }
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k}; drag=null; } });
svg.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)){ hover(e); return; }
  const prev=pointers.get(e.pointerId); moved+=Math.hypot(e.clientX-prev.x,e.clientY-prev.y); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size===2){ const [a,b]=[...pointers.values()], m=toMap((a.x+b.x)/2,(a.y+b.y)/2); zoomAt(pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d/view.k,m.x,m.y); return; }
  if(drag&&moved>4){ svg.classList.add("dragging"); const p=toMap(e.clientX,e.clientY); view.x=drag.vx+(p.x-drag.x); view.y=drag.vy+(p.y-drag.y);
    drag.vx=view.x; drag.vy=view.y; clamp(); apply(); const q=toMap(e.clientX,e.clientY); drag.x=q.x; drag.y=q.y; } });
const up=e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinch=null; if(!pointers.size){ drag=null; svg.classList.remove("dragging"); } };
svg.addEventListener("pointerup",e=>{ const wasClick=moved<5&&pointers.size===1; up(e);
  if(wasClick){ if(pressed) openPlace(pressed.dataset.id); else closeCard(); } pressed=null; });
svg.addEventListener("pointercancel",up);
document.getElementById("zin").addEventListener("click",()=>zoomAt(1.6,W/2,H/2));
document.getElementById("zout").addEventListener("click",()=>zoomAt(1/1.6,W/2,H/2));
document.getElementById("zreset").addEventListener("click",()=>{ view={x:0,y:0,k:1}; apply(); });

/* ---------- places ---------- */
const card=document.getElementById("card"), tip=document.getElementById("tip");
function findPlace(id){ return AGES[age].places.find(p=>p.id===id); }
function openPlace(id){
  const p=findPlace(id); if(!p) return; const url=p.city&&CITY_URL[p.city];
  svg.querySelectorAll(".place").forEach(g=>g.classList.toggle("on",g.dataset.id===id));
  card.innerHTML=`<button class="close" aria-label="Close">&times;</button><p class="kicker">${esc(p.kicker)} · ${age==="beleriand"?"First Age":"Third Age"}</p><h2>${esc(p.name)}</h2>
    <p class="lore">${esc(p.text)}</p>
    ${url?`<a class="go" href="${url}" target="_blank" rel="noopener">Open the city map <span aria-hidden="true">↗</span></a>`:`<span class="soon">No city map yet</span>`}`;
  card.hidden=false; card.querySelector(".close").addEventListener("click",closeCard);
}
function closeCard(){ card.hidden=true; svg.querySelectorAll(".place.on").forEach(g=>g.classList.remove("on")); }
svg.addEventListener("keydown",e=>{ const pl=e.target.closest&&e.target.closest(".place"); if(pl&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openPlace(pl.dataset.id); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeCard(); });
function hover(e){ const pl=e.target.closest&&e.target.closest(".place");
  if(!pl){ tip.hidden=true; return; } const p=findPlace(pl.dataset.id); const r=document.getElementById("app").getBoundingClientRect();
  tip.textContent=p.city&&CITY_URL[p.city]?p.name+": open the city map":p.name; tip.hidden=false; tip.style.left=(e.clientX-r.left+14)+"px"; tip.style.top=(e.clientY-r.top+14)+"px"; }
svg.addEventListener("pointerleave",()=>{ tip.hidden=true; });

/* ---------- ages ---------- */
function show(key){
  age=key; view={x:0,y:0,k:1}; closeCard();
  svg.innerHTML=(drawn[key]??=drawAge(key)); document.getElementById("app").style.background=AGES[key].painted?"#e6ecd6":""; redraw();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.age===key)));
  document.getElementById("subtitle").textContent=AGES[key].blurb+" Click a red seal to open that city's map.";
  try{ history.replaceState(null,"","#"+key); }catch(e){}
}
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.age); });
new ResizeObserver(labelDensity).observe(svg);
const start=(location.hash||"").slice(1);
show(AGES[start]?start:"middle-earth");
})();
</script>
